{# TR-1, 15 Nov 2026 - Travel's own styles, on the house tokens. #}
<style>

.tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

/* TR-5, 16 Nov 2026 - one PDF button with its two choices (Demetri: "I

.tv-menu-pop button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--alv-ink); text-align: left; }

/* TR-7, 16 Nov 2026 - past trips, ticking trips to compare, settling up. */
.tv-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
@media screen and (max-width: 575.98px) { .tv-phone.tv-phone-wide { grid-template-columns: 1fr !important; } }

.tv-pasttag { color: var(--alv-ink-soft); }

.tv-settle { border: 2px solid var(--alv-warn-ink); }

  .tv-settle-row { grid-template-columns: 28px minmax(0, 1fr); }

}
/* TR-8, 16 Nov 2026 - Used boarding passes: USED in red, diagonally; the barcode greyed until "Show the barcode anyway". */
.tv-wpass-foot { position: relative; }
.tv-used-stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-28deg); z-index: 2; pointer-events: none; color: #C62828; border: 4px solid #C62828; border-radius: 8px; padding: 0 14px; font-size: 2.6rem; font-weight: 800; letter-spacing: .12em; opacity: .88; background: rgba(255,255,255,.35); }

.tv-grip { touch-action: none; user-select: none; -webkit-user-select: none; }

.tv-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); display: flex; gap: 16px; align-items: center; background: #1D2B31; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 2000; transition: transform .2s ease; font-size: .95rem; }

.tv-linkbtn { background: none; border: 0; padding: 0; color: #0F6E77; text-decoration: underline; cursor: pointer; font: inherit; }
/* TR-11, 17 Nov 2026 - Plan my days: the free-slot grid, the choices, the proposal. */
.tv-pl-grid { display: grid; grid-template-columns: 4.2rem repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; }

.tv-pl-step.todo { color: #5B6B72; }

.tv-pl-card { border: 1px solid #E1E6E8; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; background: #FFFFFF; }
