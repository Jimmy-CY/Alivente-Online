{# TR-1, 15 Nov 2026 - Travel's own styles, on the house tokens. #}
<style>

.tv-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 230px; max-height: 340px; overflow-y: auto; padding: 6px; background: #fff; border: 1px solid var(--alv-line); border-radius: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, .12); }

/* RA02, 19 Nov 2026 - on a phone the PDF chooser lives in the More menu; its desktop wrapper steps aside with its button. */
@media screen and (max-width: 768px) { .page-action-buttons:has(.action-more-btn) > .tv-menu { display: none; } }

.tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

.tv-kindbar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 0.9rem; }

.tv-ask { border-left: 4px solid var(--alv-accent); }

.tv-acts select, .tv-acts input[type=text] { max-width: 260px; }
.tv-passcode { background: #fff; padding: 8px; border-radius: 8px; margin-top: 6px; max-width: 220px; }
.tv-passcode svg, .tv-phone svg { display: block; width: 100%; height: auto; }
.tv-phone { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: center; max-width: 560px; }
.tv-place .tv-ico { background: transparent; border: 1px dashed var(--alv-line); }

.tv-wpass { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--alv-line); }
.tv-wpass.is-next { outline: 3px solid var(--alv-accent); outline-offset: 2px; }

/* TR-5, 16 Nov 2026 - one PDF button with its two choices (Demetri: "I
   don't want two buttons for PDF"), opened by click, no script. */
.tv-menu { position: relative; display: inline-block; }
.tv-menu > summary { list-style: none; cursor: pointer; }
.tv-menu > summary::-webkit-details-marker { display: none; }
.tv-menu-pop { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 260px; display: flex; flex-direction: column; padding: 6px; border-radius: var(--alv-radius); border: 1px solid var(--alv-line); background: var(--alv-paper); box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }

.tv-menu-pop button:hover, .tv-menu-pop button:focus { background: var(--alv-surface); }
.tv-menu-pop small { color: var(--alv-ink-soft); }
/* TR-7, 16 Nov 2026 - past trips, ticking trips to compare, settling up. */
.tv-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
@media screen and (max-width: 575.98px) { .tv-phone.tv-phone-wide { grid-template-columns: 1fr !important; } }
.tv-pick { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; margin: 0; padding-left: 4px; cursor: pointer; }
.tv-pick input { width: 18px; height: 18px; }
/* RA01, 18 Nov 2026 (Demetri: "How better can better do the Compare tickboxes? Make it look better. Can it be in the trip box?") - the tick sits in the card's own footer; a ticked card takes the accent. */
.tv-pickcard { display: flex; flex-direction: column; padding: 0; margin: 0; overflow: hidden; transition: border-color .15s, box-shadow .15s; }

.tv-pickcard > .tv-card { flex: 1; border: 0; border-radius: 0; background: transparent; }
.tv-pickcard > a.tv-card:hover { border: 0; }
.tv-pickcard .tv-pick { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin: 0; padding: 0 16px; border-top: 1px solid var(--alv-line); cursor: pointer; color: var(--alv-ink-soft); font-size: 0.85rem; user-select: none; }
.tv-pickcard .tv-pick:hover { color: var(--alv-accent); background: rgba(14, 124, 139, .04); }

.tv-pickcard .tv-tick svg { opacity: 0; }

.tv-pickcard .tv-pick-on { display: none; }
.tv-pickcard:has(input:checked) .tv-pick-on { display: inline; }

.tv-pasttag { color: var(--alv-ink-soft); }

.tv-cmp { width: 100%; border-collapse: collapse; min-width: 640px; }

@media screen and (max-width: 575.98px) {
  .tv-settle-row { grid-template-columns: 28px minmax(0, 1fr); }
}
.tv-detail { display: block; color: var(--alv-ink-soft); font-size: 0.85rem; }
.tv-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.2rem; font-weight: 700; letter-spacing: .06em; }
@media screen and (max-width: 575.98px) {
  .tv-form-grid { grid-template-columns: 1fr; }
  .tv-kv { grid-template-columns: 1fr; gap: 2px; }
  .tv-kv dd { margin-bottom: 8px; }
}
/* TR-8, 16 Nov 2026 - Used boarding passes: USED in red, diagonally; the barcode greyed until "Show the barcode anyway". */
.tv-wpass-foot { position: relative; }
.tv-used-stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-28deg); z-index: 2; pointer-events: none; color: #C62828; border: 4px solid #C62828; border-radius: 8px; padding: 0 14px; font-size: 2.6rem; font-weight: 800; letter-spacing: .12em; opacity: .88; background: rgba(255,255,255,.35); }

/* TR-9, 16 Nov 2026 - the itinerary's own order: a grip to drag by, where it will land. */
.tv-drag { position: relative; display: flex; align-items: stretch; }
.tv-drag > .tv-bk { flex: 1 1 auto; min-width: 0; }

.tv-grip:hover { color: #0F6E77; }
/* TR-10 - the row lifts and follows the pointer; the others slide aside; "Order saved - Undo". */
.tv-grip { touch-action: none; user-select: none; -webkit-user-select: none; }
.tv-grip:focus-visible { outline: 2px solid #0F6E77; outline-offset: 2px; border-radius: 4px; }
[data-reorder] .tv-drag { transition: transform .16s ease; }

.tv-drag.is-lifted .tv-grip { cursor: grabbing; color: #0F6E77; }

.tv-linkbtn { background: none; border: 0; padding: 0; color: #0F6E77; text-decoration: underline; cursor: pointer; font: inherit; }
/* TR-11, 17 Nov 2026 - Plan my days: the free-slot grid, the choices, the proposal. */

.tv-pl-grid .tv-pl-head { font-size: .72rem; font-weight: 700; color: #5B6B72; text-align: center; letter-spacing: .04em; align-self: end; }

.tv-pl-cell { position: relative; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 48px; border-radius: 9px; font-size: .8rem; font-weight: 700; line-height: 1.15; padding: 4px; margin: 0; cursor: pointer; border: 1px solid #9CC9CF; background: #E3F1F3; color: #0B5A63; }

.tv-pl-cell:has(input:checked) { border: 2px solid #B85C00; background: #FFF1E3; color: #8A4500; }

.tv-pl-tag { display: inline-flex; gap: 3px; align-items: center; font-size: .68rem; font-weight: 700; border-radius: 999px; padding: 1px 7px; border: 1px solid #8A9BA2; color: #4A5A61; white-space: nowrap; }
