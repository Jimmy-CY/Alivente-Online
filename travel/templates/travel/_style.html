{# TR-1, 15 Nov 2026 - Travel's own styles, on the house tokens. #}
<style>
.tv-wrap { max-width: 1100px; }
.tv-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.tv-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--alv-line); color: var(--alv-ink); text-decoration: none; font-size: 0.9rem; }
.tv-chip:hover { color: var(--alv-accent); text-decoration: none; }
.tv-chip.is-on { border-color: var(--alv-accent); color: var(--alv-accent); font-weight: 700; }
.tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.tv-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--alv-radius); border: 1px solid var(--alv-line); color: var(--alv-ink); text-decoration: none; }
a.tv-card:hover { border-color: var(--alv-accent); text-decoration: none; color: var(--alv-ink); }
.tv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tv-name { margin: 0; font-size: 1.1rem; font-weight: 700; }
.tv-sub { color: var(--alv-ink-soft); font-size: 0.9rem; }
.tv-tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; border: 1px solid currentColor; white-space: nowrap; }
.tv-paid { color: var(--alv-good); }
.tv-due { color: var(--alv-warn-ink); }
.tv-shared { color: var(--alv-accent); }
.tv-bar { height: 8px; border-radius: 999px; overflow: hidden; border: 1px solid var(--alv-line-soft); }
.tv-bar span { display: block; height: 100%; background: var(--alv-good); }
.tv-people { display: flex; gap: 4px; flex-wrap: wrap; }
.tv-av { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--alv-line); font-size: 0.72rem; font-weight: 700; color: var(--alv-accent); }
.tv-cols { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.tv-main { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.tv-side { flex: 1 1 280px; display: flex; flex-direction: column; gap: 14px; }
.tv-day h3 { margin: 0 0 6px; font-size: 1rem; font-weight: 700; }
.tv-bk { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--alv-line-soft); color: var(--alv-ink); text-decoration: none; }
.tv-bk:first-of-type { border-top: 0; }
a.tv-bk:hover { color: var(--alv-ink); text-decoration: none; }
a.tv-bk:hover b { color: var(--alv-accent); }
.tv-ico { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--alv-line); color: var(--alv-accent); }
.tv-amt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; white-space: nowrap; }
.tv-orig { color: var(--alv-ink-soft); font-size: 0.8rem; }
.tv-kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; margin: 0; }
.tv-kv dt { color: var(--alv-ink-soft); font-weight: 400; }
.tv-kv dd { margin: 0; }
.tv-ref { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.05rem; letter-spacing: .02em; }
.tv-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
.tv-kindbar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 0.9rem; }
.tv-kindbar .tv-bar span { background: var(--alv-accent); }
.tv-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; max-width: 820px; }
.tv-form-grid .tv-wide { grid-column: 1 / -1; }
.tv-money { text-align: right; font-variant-numeric: tabular-nums; }
.tv-files { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.tv-files li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tv-off b, .tv-off .tv-sub { text-decoration: line-through; }
.tv-off .tv-tag { text-decoration: none; }
.tv-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; margin-left: 4px; border-radius: 999px; border: 1px solid currentColor; font-size: 0.75rem; font-weight: 700; }
.tv-ask { border-left: 4px solid var(--alv-accent); }
.tv-item { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; }
.tv-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.tv-acts form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0; }
.tv-acts select, .tv-acts input[type=text] { max-width: 260px; }
.tv-passcode { background: #fff; padding: 8px; border-radius: 8px; margin-top: 6px; max-width: 220px; }
.tv-passcode svg, .tv-phone svg { display: block; width: 100%; height: auto; }
.tv-phone { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: center; max-width: 560px; }
.tv-place .tv-ico { background: transparent; border: 1px dashed var(--alv-line); }
.tv-passgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 340px)); gap: 18px; align-items: start; }
.tv-wpass { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--alv-line); }
.tv-wpass.is-next { outline: 3px solid var(--alv-accent); outline-offset: 2px; }
.tv-wpass-flag { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 1px 10px; border-radius: 999px; border: 1px solid #fff; color: #fff; font-size: 0.72rem; font-weight: 700; }
.tv-wpass-top { background: #123B5C; color: #fff; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.tv-wpass-code { font-size: 2.1rem; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
.tv-wpass-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.tv-wpass-grid small { display: block; font-size: 0.68rem; opacity: .8; }
.tv-wpass-foot { padding: 12px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
/* TR-5, 16 Nov 2026 - one PDF button with its two choices (Demetri: "I
   don't want two buttons for PDF"), opened by click, no script. */
.tv-menu { position: relative; display: inline-block; }
.tv-menu > summary { list-style: none; cursor: pointer; }
.tv-menu > summary::-webkit-details-marker { display: none; }
.tv-menu-pop { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 260px; display: flex; flex-direction: column; padding: 6px; border-radius: var(--alv-radius); border: 1px solid var(--alv-line); background: var(--alv-paper); box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
.tv-menu-pop button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--alv-ink); text-align: left; }
.tv-menu-pop button:hover, .tv-menu-pop button:focus { background: var(--alv-surface); }
.tv-menu-pop small { color: var(--alv-ink-soft); }
/* TR-7, 16 Nov 2026 - past trips, ticking trips to compare, settling up. */
.tv-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
@media screen and (max-width: 575.98px) { .tv-phone.tv-phone-wide { grid-template-columns: 1fr !important; } }
.tv-pickcard { display: flex; flex-direction: column; gap: 6px; }
.tv-pickcard > .tv-card { flex: 1; }
.tv-pick { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; margin: 0; padding-left: 4px; cursor: pointer; }
.tv-pick input { width: 18px; height: 18px; }
.tv-pasttag { color: var(--alv-ink-soft); }
.tv-note { padding: 10px 14px; border-radius: var(--alv-radius); border: 1px solid var(--alv-line); background: var(--alv-surface); }
.tv-settle { border: 2px solid var(--alv-warn-ink); }
.tv-settle-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 110px 130px; gap: 8px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--alv-line-soft); }
.tv-cmp { width: 100%; border-collapse: collapse; min-width: 640px; }
.tv-cmp th, .tv-cmp td { padding: 9px 8px; text-align: left; vertical-align: top; border-top: 1px solid var(--alv-line-soft); }
.tv-cmp thead th { border-top: 0; color: var(--alv-ink-soft); font-weight: 600; font-size: 0.85rem; }
.tv-cmp tr.is-strong td, .tv-cmp tr.is-strong th { border-top: 2px solid var(--alv-ink); font-weight: 700; }
.tv-low { color: var(--alv-good); font-weight: 700; font-size: 0.78rem; }
.tv-more { color: var(--alv-warn-ink); font-weight: 700; font-size: 0.78rem; }
.tv-split { display: flex; height: 22px; border-radius: 6px; overflow: hidden; min-width: 4px; }
.tv-split span { display: block; height: 100%; }
.tv-key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; }
@media screen and (max-width: 575.98px) {
  .tv-settle-row { grid-template-columns: 28px minmax(0, 1fr); }
}
.tv-detail { display: block; color: var(--alv-ink-soft); font-size: 0.85rem; }
.tv-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.2rem; font-weight: 700; letter-spacing: .06em; }
@media screen and (max-width: 575.98px) {
  .tv-form-grid { grid-template-columns: 1fr; }
  .tv-kv { grid-template-columns: 1fr; gap: 2px; }
  .tv-kv dd { margin-bottom: 8px; }
}
/* TR-8, 16 Nov 2026 - Used boarding passes: USED in red, diagonally; the barcode greyed until "Show the barcode anyway". */
.tv-wpass-foot { position: relative; }
.tv-used-stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-28deg); z-index: 2; pointer-events: none; color: #C62828; border: 4px solid #C62828; border-radius: 8px; padding: 0 14px; font-size: 2.6rem; font-weight: 800; letter-spacing: .12em; opacity: .88; background: rgba(255,255,255,.35); }
.tv-wpass.is-used .tv-code-box { opacity: .22; filter: grayscale(1); }
.tv-wpass.is-used.show-anyway .tv-code-box { opacity: 1; filter: none; }
.tv-wpass.is-used.show-anyway .tv-used-stamp { opacity: .25; }
.tv-wpass.is-used .tv-wpass-top { filter: grayscale(.7); }
</style>
