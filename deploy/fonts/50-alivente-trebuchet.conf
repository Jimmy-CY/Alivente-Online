<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- GE-1, 28 Oct 2026. The lease templates ask for Trebuchet MS, a
     Microsoft font the server cannot carry. LibreOffice turns a lease into
     the e-signing PDF here, and this maps Trebuchet MS to Inter - the face
     the approved mock-ups were rendered in. The Word download is untouched
     and opens in Trebuchet on a PC that has it. -->
<fontconfig>
  <alias binding="same">
    <family>Trebuchet MS</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
