{# RA28, 26 Nov 2026 - the fields of a results page's filter panel (Demetri: "I want to be able to filter and sort"). The page wears the house panel itself (base's Filter button, the chips row, the panel) and includes these inside its grid. #}
<div class="filter-group">
  <label class="filter-label" for="acqQ"><i class="fas fa-search"></i> <strong>Search</strong></label>
  <input type="text" name="q" id="acqQ" class="form-control filter-input" placeholder="Title or area..." value="{{ f.q }}">
</div>
<div class="filter-group">
  <label class="filter-label" for="acqArea"><i class="fas fa-map-marker-alt"></i> <strong>Area</strong></label>
  <select name="area" id="acqArea" class="form-control filter-select">
    <option value="">All Areas</option>
    {% for a in f_areas %}<option value="{{ a }}" {% if f.area|lower == a|lower %}selected{% endif %}>{{ a }}</option>{% endfor %}
  </select>
</div>
<div class="filter-group">
  <label class="filter-label" for="acqStatus"><i class="fas fa-info-circle"></i> <strong>Status</strong></label>
  <select name="status" id="acqStatus" class="form-control filter-select">
    {% for key, label, count in f_statuses %}<option value="{% if key != 'all' %}{{ key }}{% endif %}" {% if status == key %}selected{% endif %}>{{ label }} ({{ count }})</option>{% endfor %}
  </select>
</div>
<div class="filter-group">
  <label class="filter-label" for="acqPmin"><i class="fas fa-euro-sign"></i> <strong>Price from</strong></label>
  <input type="number" min="0" step="1000" inputmode="numeric" name="pmin" id="acqPmin" class="form-control filter-input" placeholder="Any" value="{{ f.pmin }}">
</div>
<div class="filter-group">
  <label class="filter-label" for="acqPmax"><i class="fas fa-euro-sign"></i> <strong>Price to</strong></label>
  <input type="number" min="0" step="1000" inputmode="numeric" name="pmax" id="acqPmax" class="form-control filter-input" placeholder="Any" value="{{ f.pmax }}">
</div>
<div class="filter-group">
  <label class="filter-label" for="acqSmin"><i class="fas fa-ruler-combined"></i> <strong>{% if f_plot %}Plot m&sup2; from{% else %}Size m&sup2; from{% endif %}</strong></label>
  <input type="number" min="0" step="1" inputmode="numeric" name="smin" id="acqSmin" class="form-control filter-input" placeholder="Any" value="{{ f.smin }}">
</div>
<div class="filter-group">
  <label class="filter-label" for="acqSmax"><i class="fas fa-ruler-combined"></i> <strong>{% if f_plot %}Plot m&sup2; to{% else %}Size m&sup2; to{% endif %}</strong></label>
  <input type="number" min="0" step="1" inputmode="numeric" name="smax" id="acqSmax" class="form-control filter-input" placeholder="Any" value="{{ f.smax }}">
</div>
{% if not f_plot %}
<div class="filter-group">
  <label class="filter-label" for="acqBeds"><i class="fas fa-bed"></i> <strong>Bedrooms, at least</strong></label>
  <select name="beds" id="acqBeds" class="form-control filter-select">
    <option value="">Any</option>
    {% for n in "12345" %}<option value="{{ n }}" {% if f.beds == n %}selected{% endif %}>{{ n }}</option>{% endfor %}
  </select>
</div>
{% endif %}
<div class="filter-group">
  <label class="filter-label" for="acqOpened"><i class="fas fa-eye"></i> <strong>Opened</strong></label>
  <select name="opened" id="acqOpened" class="form-control filter-select">
    <option value="">All</option>
    {% for k, v in f_opened.items %}<option value="{{ k }}" {% if f.opened == k %}selected{% endif %}>{{ v }}</option>{% endfor %}
  </select>
</div>
<div class="filter-group">
  <label class="filter-label" for="acqSort"><i class="fas fa-sort"></i> <strong>Sort</strong></label>
  <select name="sort" id="acqSort" class="form-control filter-select">
    {% for k, v in sorts.items %}<option value="{% if k != 'score' %}{{ k }}{% endif %}" {% if sort == k %}selected{% endif %}>{{ v.0 }}</option>{% endfor %}
  </select>
</div>
<script>
// RA28 - a choice applies at once; a typed figure or search applies on Enter or on leaving the field.
(function () {
  var form = document.getElementById('filterForm');
  if (!form) { return; }
  // An empty field would put "q=&pmin=" in the address; leave them out.
  form.addEventListener('submit', function () {
    Array.prototype.forEach.call(form.elements, function (el) { if (el.name && !el.value) { el.disabled = true; } });
  });
  // requestSubmit fires the submit event, so base keeps the panel open across the reload.
  form.addEventListener('change', function () { if (form.requestSubmit) { form.requestSubmit(); } else { form.submit(); } });
})();
</script>
