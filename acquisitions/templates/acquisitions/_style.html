{# Acquisitions - the module's own rules, on base's tokens only (RA19). #}
<style>
  .acq-tabs { margin: 0 0 18px; flex-wrap: wrap; }
  .acq-tabs .alv-tab { text-decoration: none; }
  .acq-badge { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; background: var(--alv-warn-soft); color: var(--alv-warn-ink); border: 1px solid var(--alv-warn-line); }
  .acq-sub { margin: -6px 0 16px; color: var(--alv-ink-soft); font-size: 14px; }
  .acq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin: 0 0 20px; }
  .acq-two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .acq-card-figs { display: flex; flex-wrap: wrap; gap: 18px; margin: 10px 0; }
  .acq-fig strong { display: block; font-size: 1.35rem; color: var(--alv-ink-strong); }
  .acq-fig span { font-size: 12px; color: var(--alv-ink-soft); }
  .acq-muted { color: var(--alv-ink-soft); font-size: 13px; }
  .acq-score { display: inline-flex; flex-direction: column; gap: 3px; min-width: 52px; }
  .acq-scorebar { display: block; height: 6px; border-radius: 3px; background: var(--alv-line-soft); overflow: hidden; }
  .acq-scorebar > span { display: block; height: 100%; }
  .acq-scorebar .is-good { background: var(--alv-good); }
  .acq-scorebar .is-mid { background: var(--alv-warn); }
  .acq-scorebar .is-low { background: var(--alv-bad); }
  .acq-bars { list-style: none; margin: 0; padding: 0; }
  .acq-bars li { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) 56px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
  .acq-bar { height: 10px; border-radius: 5px; background: var(--alv-line-soft); overflow: hidden; }
  .acq-bar > span { display: block; height: 100%; background: var(--alv-accent); }
  .acq-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .acq-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--alv-line); border-radius: 16px; background: var(--alv-paper); color: var(--alv-ink); font-size: 13px; text-decoration: none; }
  .acq-chip:hover { border-color: var(--alv-accent-line); color: var(--alv-ink-strong); text-decoration: none; }
  .acq-chip.is-on { background: var(--alv-accent-soft); border-color: var(--alv-accent-line); color: var(--alv-accent-ink); font-weight: 600; }
  .acq-pc { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: var(--alv-radius-sm); font-size: 11px; font-weight: 700; background: var(--alv-info-soft); color: var(--alv-accent-ink); border: 1px solid var(--alv-accent-line); }
  .acq-sites { list-style: none; margin: 0; padding: 0; }
  .acq-sites li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--alv-line-soft); font-size: 14px; }
  .acq-sites li:last-child { border-bottom: 0; }
  .acq-ok { color: var(--alv-good-ink); }
  .acq-bad { color: var(--alv-bad-ink); }
  .acq-warn { color: var(--alv-warn-ink); }
  .acq-mark { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; font-weight: 700; }
  .acq-mark.met { background: var(--alv-good-soft); color: var(--alv-good-ink); }
  .acq-mark.failed { background: var(--alv-bad-soft); color: var(--alv-bad-ink); }
  .acq-mark.unknown { background: var(--alv-warn-soft); color: var(--alv-warn-ink); }
  .acq-mark.partial { background: var(--alv-info-soft); color: var(--alv-accent-ink); }
  .acq-card-list { list-style: none; margin: 0; padding: 0; }
  .acq-card-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--alv-line-soft); }
  .acq-card-list li:last-child { border-bottom: 0; }
  .acq-facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  .acq-facts dt { color: var(--alv-ink-soft); font-weight: 400; }
  .acq-facts dd { margin: 0; color: var(--alv-ink); }
  .acq-chart { width: 100%; height: auto; display: block; }
  .acq-chart .axis { stroke: var(--alv-line); stroke-width: 1; }
  .acq-chart .line { fill: none; stroke: var(--alv-accent); stroke-width: 2.5; }
  .acq-chart .dot { fill: var(--alv-accent); }
  .acq-chart text { font-size: 11px; fill: var(--alv-ink-soft); }
  .acq-chart .s1 { stroke: var(--alv-series-1); } .acq-chart .s2 { stroke: var(--alv-series-2); }
  .acq-chart .s3 { stroke: var(--alv-series-3); } .acq-chart .s4 { stroke: var(--alv-series-4); }
  .acq-key { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; }
  .acq-key.s1 { background: var(--alv-series-1); } .acq-key.s2 { background: var(--alv-series-2); }
  .acq-key.s3 { background: var(--alv-series-3); } .acq-key.s4 { background: var(--alv-series-4); }
  .acq-spark { width: 110px; height: 26px; }
  .acq-spark polyline { fill: none; stroke: var(--alv-accent); stroke-width: 2; }
  .acq-crit-table td, .acq-crit-table th { vertical-align: middle; }
  /* RA23 - fixed widths, so long words wrap in their cell rather than push
     the Actions off the card. */
  .acq-crit-table { table-layout: fixed; width: 100%; }
  .acq-crit-table td { overflow-wrap: break-word; }
  .acq-crit-table th { white-space: normal; }
  .acq-crit-field { font-size: 12px; color: var(--alv-ink-soft); margin-top: 2px; }
  .acq-points { font-weight: 700; }
  .acq-points.is-off { color: var(--alv-bad-ink); }
  .acq-check-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 16px; }
  .acq-check-list label { display: flex; align-items: center; gap: 8px; min-height: 36px; margin: 0; font-weight: 400; }
  .acq-section-h { margin: 0 0 12px; font-size: 16px; font-weight: 700; color: var(--alv-ink-strong); }
  .acq-days { list-style: none; margin: 0; padding: 0; }
  .acq-days li { display: grid; grid-template-columns: 140px 120px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--alv-line-soft); font-size: 14px; }
  .acq-quote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--alv-accent-line); background: var(--alv-surface); color: var(--alv-ink); font-size: 14px; }
  @media screen and (max-width: 991px) {
    .acq-two { grid-template-columns: minmax(0, 1fr); }
    .acq-days li { grid-template-columns: 110px minmax(0, 1fr); }
    .acq-days li > :last-child { grid-column: 1 / -1; }
  }
/* The editor's section titles carry the points total on the right. */
.acq-section-title { display: flex; align-items: baseline; gap: 6px; }
.acq-section-title .ml-auto { font-size: 14px; font-weight: 400; }
/* RA22 - Build rules step by step. */
.acq-wz-feat-group { margin: 12px 0 2px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--alv-accent-ink); }   /* RA24 */
.acq-wz-num { display: inline-block; width: 84px; margin-left: 6px; }
.acq-folds { align-items: start; }   /* RA24 - folding boxes on the Overview */
.acq-fold > summary { display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; }
.acq-fold > summary::-webkit-details-marker { display: none; }
.acq-fold-icon { margin-left: auto; color: var(--alv-ink-soft); transition: transform .15s; }
.acq-fold[open] .acq-fold-icon { transform: rotate(180deg); }
.acq-brief-frame { display: block; width: 100%; height: 75vh; border: 0; }
/* RA26 - a list of ticks is a house table; the header's tick box ticks or clears them all (_ticks.html). */
.acq-tick-wrap { max-height: 320px; overflow-y: auto; margin-bottom: 8px; }
.acq-tick { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 400; cursor: pointer; }
.acq-tick input { flex: 0 0 auto; }
.acq-tick-table th .acq-tick { font-weight: 700; }
/* RA27 - a search followed as it reports, in the Run and PC pop-ups. */
.acq-progress { border-top: 1px solid var(--alv-line-soft); padding-top: 8px; font-size: 14px; }
.acq-progress > div { margin: 2px 0; }
/* RA26 - a price range may break at its dash, and stays the tiles' size. */
.acq-stat-range .alv-stat-value { white-space: normal; }
.acq-explain { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; color: var(--alv-ink-soft); }
.acq-explain dt { font-weight: 600; color: var(--alv-ink); }
.acq-explain dd { margin: 0; }
@media screen and (max-width: 575px) { .acq-explain { grid-template-columns: 1fr; } .acq-explain dd { margin-bottom: 6px; } }
.acq-wz-head { display: flex; justify-content: flex-end; }
.acq-wz-dots { display: flex; gap: 6px; margin: 6px 0 16px; }
.acq-wz-dots span { flex: 1; height: 4px; border-radius: 2px; background: var(--alv-line); }
.acq-wz-dots span.is-on { background: var(--alv-accent); }
.acq-wz-q { margin: 0 0 4px; font-size: 16px; font-weight: 700; color: var(--alv-ink-strong); }
.acq-wz-types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.acq-wz-type { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0; padding: 16px 8px; border: 1px solid var(--alv-line); border-radius: var(--alv-radius-sm); cursor: pointer; font-weight: 600; }
.acq-wz-type i { font-size: 22px; color: var(--alv-ink-soft); }
.acq-wz-two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 420px; }
.acq-wz-type:has(input:checked) { border-color: var(--alv-accent-line); background: var(--alv-accent-soft); color: var(--alv-accent-ink); }
.acq-wz-type:has(input:checked) i { color: var(--alv-accent-ink); }
.acq-wz-feat { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--alv-line-soft); font-size: 14px; }
.acq-wz-feat label { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 36px; margin: 0; font-weight: 400; }
.acq-wz-feat-head { font-size: 12px; font-weight: 700; color: var(--alv-ink-soft); text-align: center; }
.acq-wz-feat-say { display: none; }
.acq-wz-pts { padding: 4px 0; }
.acq-wz-total { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; }
.acq-wz-modal .modal-footer { flex-wrap: wrap; row-gap: 8px; }
@media screen and (max-width: 575px) {
  .acq-wz-feat { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .acq-wz-feat > span:first-child { grid-column: 1 / -1; }
  .acq-wz-feat-head { display: none; }
  .acq-wz-feat-say { display: inline; font-size: 12px; }
}
/* RA30, 26 Nov 2026 - the Area tick-box list (the Recipes page's
   multi-select, on house tokens), the slim figures row, the folded
   report, and the holding-back tags. */
.filter-multiselect-dropdown { position: relative; }
.filter-multiselect-button { width: 100%; height: 38px; padding: 6px 12px; background: var(--alv-paper); border: 1px solid var(--alv-line); border-radius: var(--alv-radius-sm); display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left; color: var(--alv-ink); }
.filter-multiselect-button.active, .filter-multiselect-button:focus-visible { border-color: var(--alv-accent); outline: none; }
.filter-multiselect-placeholder { color: var(--alv-ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter-multiselect-button.has-value .filter-multiselect-placeholder { color: var(--alv-ink); }
.filter-multiselect-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; margin-top: 4px; max-height: 260px; overflow-y: auto; background: var(--alv-paper); border: 1px solid var(--alv-accent-line); border-radius: var(--alv-radius-sm); }
.filter-multiselect-menu.show { display: block; }
.filter-multiselect-item { display: flex; align-items: center; gap: 8px; margin: 0; padding: 7px 12px; cursor: pointer; font-weight: 400; }
.filter-multiselect-item:hover { background: var(--alv-surface); }
.acq-figrow { display: flex; flex-wrap: wrap; border: 1px solid var(--alv-line-soft); border-radius: var(--alv-radius-sm); background: var(--alv-paper); margin-bottom: 8px; }
.acq-figrow-i { padding: 6px 16px; border-right: 1px solid var(--alv-line-soft); text-align: center; }
.acq-figrow-i:last-child { border-right: 0; }
.acq-figrow-v { display: block; font-size: 17px; font-weight: 600; color: var(--alv-ink-strong); }
.acq-figrow-l { display: block; font-size: 12px; color: var(--alv-ink-soft); }
.acq-report { margin-bottom: 8px; }
.acq-report > summary { cursor: pointer; color: var(--alv-ink-soft); font-size: 13px; }
.acq-report > summary b { color: var(--alv-accent-ink); font-weight: 600; }
.acq-report-body { margin-top: 8px; padding: 10px 14px; border: 1px solid var(--alv-line-soft); border-radius: var(--alv-radius-sm); background: var(--alv-paper); }
.acq-held { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 13px; }
.acq-held-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--alv-warn-line); background: var(--alv-warn-soft); color: var(--alv-warn-ink); text-decoration: none; }
.acq-held-tag:hover, .acq-held-tag.is-on { border-color: var(--alv-warn-ink); color: var(--alv-warn-ink); text-decoration: none; }
.acq-held-tag.is-on { font-weight: 600; }
@media screen and (max-width: 767.98px) { .acq-figrow-i { flex: 1 1 33%; border-right: 0; } }
/* RA29, 26 Nov 2026 - the note bubble beside a listing's title: his
   comment, his decision and reason, his viewings. Fixed, so a table that
   scrolls sideways cannot clip it; placed by the script below. */
.acq-note { display: inline-block; margin-left: 6px; }
.acq-note-btn { border: 0; background: none; padding: 0 2px; color: var(--alv-accent); cursor: pointer; font-size: 14px; line-height: 1; }
.acq-note-btn:focus-visible { outline: 2px solid var(--alv-accent-line); border-radius: var(--alv-radius-sm); }
.acq-note-box { display: none; position: fixed; z-index: 1060; width: 300px; max-width: calc(100vw - 24px); padding: 10px 12px; background: var(--alv-paper); color: var(--alv-ink); border: 1px solid var(--alv-line); border-radius: var(--alv-radius-sm); font-size: 13px; font-weight: 400; text-align: left; white-space: normal; }
.acq-note.is-open .acq-note-box { display: block; }
.acq-note-h { display: block; font-weight: 600; color: var(--alv-ink-strong); margin-top: 6px; }
.acq-note-h:first-child { margin-top: 0; }
.acq-note-p { display: block; color: var(--alv-ink); }
@media print { .acq-note { display: none; } }
</style>
<script>
// RA29 - hover or focus opens the bubble; a tap pins it until a tap elsewhere.
(function () {
  // The bubble is drawn by the notetip filter, not by this template, so
  // every look-up is checked before it is used.
  function place(n) {
    var btn = n.querySelector('.acq-note-btn'), box = n.querySelector('.acq-note-box');
    if (!btn || !box) { return; }
    var r = btn.getBoundingClientRect();
    var w = Math.min(300, window.innerWidth - 24);
    box.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + 'px';
    box.style.top = (r.bottom + 6) + 'px';
    if (r.bottom + 6 + box.offsetHeight > window.innerHeight - 8) {
      box.style.top = Math.max(8, r.top - 6 - box.offsetHeight) + 'px';
    }
  }
  function open(n, on) {
    n.classList.toggle('is-open', on);
    var btn = n.querySelector('.acq-note-btn');
    if (btn) { btn.setAttribute('aria-expanded', on ? 'true' : 'false'); }
    if (on) { place(n); }
  }
  function shut(except) {
    Array.prototype.forEach.call(document.querySelectorAll('.acq-note.is-open'), function (n) {
      if (n !== except) { n.classList.remove('is-pinned'); open(n, false); }
    });
  }
  document.addEventListener('mouseover', function (e) {
    var n = e.target.closest && e.target.closest('.acq-note');
    if (n && !n.classList.contains('is-open')) { shut(n); open(n, true); }
  });
  document.addEventListener('mouseout', function (e) {
    var n = e.target.closest && e.target.closest('.acq-note');
    if (n && !n.contains(e.relatedTarget) && !n.classList.contains('is-pinned')) { open(n, false); }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.acq-note-btn');
    if (!b) { shut(null); return; }
    var n = b.parentNode, pin = !n.classList.contains('is-pinned');
    shut(n);
    n.classList.toggle('is-pinned', pin);
    open(n, pin);
  });
  document.addEventListener('focusin', function (e) {
    var n = e.target.closest && e.target.closest('.acq-note');
    if (n) { shut(n); open(n, true); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { shut(null); } });
  window.addEventListener('scroll', function () { shut(null); }, true);
})();
</script>
