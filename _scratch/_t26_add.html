   Physical Invoices, the Analysis year pickers, the Edit Issue fields,
   seven "Applies from" dates. Chromium's own cascade said the same of
   all 64 - the PAGE made it small, with a local rule or an inline style
   at 13-14px, which beats a plain base rule by coming later or by being
   written on the element.
   So this one is important, the only way a stylesheet outranks inline.
   It cannot make anything smaller: measured, no text control on any page
   is above 16px at 375. The desktop is untouched - screen, 768 and below.
   Checkboxes, radios, buttons, colour and file pickers are left out;
   iOS does not zoom on them. Keep the input selector on ONE line - a
   line break inside that chain is a descendant combinator.
   See Show-SmallControls.py and test_small_controls.py. */
@media screen and (max-width: 768px) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="file"]):not([type="image"]):not([type="range"]):not([type="color"]),
    select,
    textarea { font-size: 16px !important; }
}
/* /ALV SMALL CONTROLS v1 */

/* ALV CUSTOM CONTROL v1 - 4 Oct 2026 ------------------------------------
   Demetri, of the Generate Task List modal: "I don't like the Blue on the
   Radio Button. I want something within our theme."

   NOTHING HERE HAD EVER CLAIMED THIS COMPONENT. base.html carried zero
   rules naming .custom-control, so the dot in a selected radio and the
   tick in a ticked box were drawn by bootstrap 4.1.3 in #007bff - on
   thirteen controls across three pages: seven radios on projects_detail
   (Budget Copy Options, and the English/Greek pair Demetri was looking
   at), five checkboxes on celebration_management, one on view_meal_plan.

   --alv-accent, AND NOT BY TASTE. Its own definition two thousand lines
   up reads "the system's own colour: primary actions, selection", and a
   checked radio is selection. The focus halo is --alv-accent-ring, the
   same one .form-control:focus draws, so a radio and a text box answer
   the keyboard the same way.

   BOOTSTRAP WRITES THE CHECKED COLOUR THREE TIMES, AT TWO SPECIFICITIES,
   and the first version of this block only matched one of them:

       .custom-control-input:checked ~ ... ::before        0,2,1  #007bff
       .custom-radio    .custom-control-input:checked ~ …  0,3,1  #007bff
       .custom-checkbox .custom-control-input:checked ~ …  0,3,1  #007bff

   A single 0,2,1 rule beats the first and LOSES to the other two. The
   browser test in section 2 is what found it: the radio turned and the
   checkboxes stayed blue, while every text search in the suite passed.
   So the selectors below are matched one for one, per type, and a
   comma group keeps each member's own specificity.

   AND IT IS background-color, NOT border. These controls have no border
   in 4.1.3 - the box is a filled ::before - so a border-color on its own
   sets a colour on a border that is not drawn. That was the other half
   of the same mistake.

   IT WINS BY BEING LATER, never by shouting: bootstrap.min.css is linked
   at the top of this file, above every style block in it, which is the
   same mechanism the tab component relies on. No !important, so a page
   that genuinely needs a different control can still write one.

   WHAT IT REPLACED, named so it is never re-derived: #007bff (the
   checked fill, three times), rgba(0,123,255,.25) (the focus halo),
   #b3d7ff (the active press), rgba(0,123,255,.5) (disabled but
   checked, twice), #6c757d (the disabled label) and #e9ecef (the
   disabled box).
                                            [test_custom_control.py] */
.custom-control-input:checked ~ .custom-control-label::before,
.custom-radio .custom-control-input:checked ~ .custom-control-label::before,
.custom-checkbox .custom-control-input:checked ~ .custom-control-label::before {
    background-color: var(--alv-accent);
}
.custom-control-input:focus ~ .custom-control-label::before {
    box-shadow: 0 0 0 1px var(--alv-paper), 0 0 0 3px var(--alv-accent-ring);
}
.custom-control-input:active ~ .custom-control-label::before {
    background-color: var(--alv-accent-soft);
}
.custom-control-input:disabled ~ .custom-control-label {
    color: var(--alv-ink-faint);
}
.custom-control-input:disabled ~ .custom-control-label::before {
    background-color: var(--alv-surface-deep);
}
.custom-radio .custom-control-input:disabled:checked ~ .custom-control-label::before,
.custom-checkbox .custom-control-input:disabled:checked ~ .custom-control-label::before,
.custom-checkbox .custom-control-input:disabled:indeterminate ~ .custom-control-label::before {
    background-color: var(--alv-accent-line);
}
/* /ALV CUSTOM CONTROL v1 */

/* ALV PRINT BUTTONS v1 - A BUTTON IS FURNITURE ON PAPER.
   base's print block names containers - the action bar, the mobile bar,
   modals - and a button anywhere else printed. Measured at A4 portrait
   width: 283 of them on 55 pages, from Help and Back to row actions,
   disabled placeholders, quick-set chips and view toggles.
   So every button goes, the three button input types with it. The one
   exception is a button that IS content: mark it print-keep and it
   prints. home's dashboard rows are the case this was written for -
   each row of a card is a button so a keyboard can click through it,
   and without the mark the cards would print empty.
   Measured before writing: only buttons and what is inside them leave
   the page; nothing else on any page moves. The screen is untouched.
   See test_print_buttons.py. */
@media print {
    button:not(.print-keep),
    .btn:not(.print-keep),
    input[type="submit"],
    input[type="button"],
    input[type="reset"] { display: none !important; }
}
/* /ALV PRINT BUTTONS v1 */

/* ALV MODAL HEAD v1 - ONE POP-UP HEADER.
   Measured 21 Sep: 87 modal headers in 16 looks, and base defined none. A
   delete confirmation was red on fourteen, white on two, grey on one.
   This is the teal banner the Issues, Help and preview pop-ups already
   wore, with a white title and a white close button; the danger variant
   is the same banner in red, for a pop-up that deletes something.
   The paint is important on purpose. Headers were painted by Bootstrap's
   own important colour classes, by page rules scoped to a modal's id and
   by inline styles, and the standard has to win over all three.
   See test_modal_heads.py. */
.alv-modal-head {
    background: linear-gradient(135deg, var(--alv-accent) 0%,
                var(--alv-accent-ink) 100%) !important;
    color: var(--alv-on-accent) !important;
    border-bottom: 0 !important;
    padding: 16px 20px !important;
    align-items: center;
}
.alv-modal-head--danger {
    background: linear-gradient(135deg, var(--alv-bad) 0%,
                color-mix(in srgb, var(--alv-bad) 78%, #000) 100%) !important;
}
.alv-modal-head .modal-title,
.alv-modal-head h1, .alv-modal-head h2, .alv-modal-head h3,
.alv-modal-head h4, .alv-modal-head h5, .alv-modal-head h6 {
    color: var(--alv-on-accent) !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    line-height: 1.3;
    margin: 0;
}
.alv-modal-head .modal-title i,
.alv-modal-head h5 i { color: inherit !important; margin-right: 8px; }
.alv-modal-head .close {
    color: var(--alv-on-accent) !important;
    opacity: 0.85 !important;
    text-shadow: none !important;
}
.alv-modal-head .close:hover { opacity: 1 !important; }
/* /ALV MODAL HEAD v1 */

/* ===== ALV MODAL OVERLAY v1 ===== 24 Sep 2026
   THE POP-UP THAT IS NOT BOOTSTRAP'S.

   home and notifications build their drill-down pop-up in JavaScript - a
   div with class="modal-overlay", written as a string - so there is no
   .modal-dialog for .alv-modal-head to hang on, and 3.9 could never have
   reached it. Both pages carried the same eleven rules, one copied from
   the other; home's own comment said so.

   DIFFED, not eyeballed: the two copies differed in exactly two ways.
   One is whitespace inside rgba(). The other is the phone height - home
   said 100dvh, notifications said 100vh - and 100vh is wrong on a phone,
   because a browser's address bar counts inside 100vh and is not part of
   the screen: the pop-up's bottom edge, and its last row, sit under the
   toolbar. home had already fixed it. This is home's.

   The header is the SAME gradient declaration as .alv-modal-head, so
   this pop-up and the 51 Bootstrap ones are ONE look; both copies spelt
   the accent #0e7c8b by hand. test_modal_overlay.py renders the two and
   fails if they ever stop matching.

   The class names are the pages' own, unchanged: the markup is built in
   a script, so base takes the RULES and the pages keep the NAMES -
   exactly the call D4 made for .filter-select.

   Two literals are deliberate. rgba(0,0,0,.5) is the backdrop and
   rgba(0,0,0,.3) its shadow: there is no token for a scrim, and neither
   is a colour of the palette. The 12px corner is a POP-UP's corner;
   --alv-radius is 8px and is the card's.
   See test_modal_overlay.py. */
.modal-overlay {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
}
.modal-overlay .modal-content {
    background: var(--alv-paper);
    border-radius: 12px;
    max-width: 90vw; max-height: 90vh;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}
.modal-overlay .modal-header {
    background: linear-gradient(135deg, var(--alv-accent) 0%,
                var(--alv-accent-ink) 100%);
    color: var(--alv-on-accent);
    padding: 20px;
    display: flex; justify-content: space-between; align-items: center;
}
.modal-overlay .modal-title {
    margin: 0;
    font-size: 20px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
}
.modal-overlay .modal-close {
    background: none; border: none;
    color: var(--alv-on-accent);
    font-size: 24px; cursor: pointer; padding: 0;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
}
.modal-overlay .modal-close:hover {
    background: color-mix(in srgb, var(--alv-on-accent) 20%, transparent);
}
.modal-overlay .modal-body {
    padding: 20px;
    max-height: 70vh; overflow-y: auto;
}
@media screen and (max-width: 768px) {
    .modal-overlay { height: 100dvh; }
    .modal-overlay .modal-content {
        max-width: 100vw; max-height: 100dvh;
        width: 100vw; height: 100dvh;
        border-radius: 0;
        display: flex; flex-direction: column;
        padding-top: env(safe-area-inset-top, 0);
        padding-bottom: env(safe-area-inset-bottom, 0);
        box-sizing: border-box;
    }
    .modal-overlay .modal-header { padding: 14px 16px; flex-shrink: 0; }
    .modal-overlay .modal-title { font-size: 16px; }
    .modal-overlay .modal-body {
        padding: 14px; max-height: none;
        flex: 1 1 auto; overflow-y: auto;
    }
}
/* ===== /ALV MODAL OVERLAY v1 ===== */

/* ===== ALV AVATAR v1 ===== 25 Sep 2026
   The signed-in person, as a disc of their initials. FIVE copies of this
   existed - .sidebar-avatar and an inline style= in base itself,
   .member-avatar on workspace_edit, .user-avatar on user_administration
   and .photo-placeholder on my_profile - all painting the same purple
   gradient, all flex-centring the same white initials, at 32 / 36 / 38 /
   32 / 80 pixels.

   FOUR OF THE FIVE FAILED CONTRAST. The initials are 12-15px, so 4.5:1 is
   the bar, and #667eea - the light end of the gradient, the top-left half
   of the disc - measures 3.66 against white. (The 80px one is large text
   and passed at 3.0; said so it is not claimed as more than it was.)

   THE PAINT IS FLAT, AND THAT IS MEASURED. This disc sits on the sidebar,
   #343a40, so it has to carry white initials AND stay apart from what is
   behind it. The house gradient - accent to accent-ink, as .alv-modal-head
   wears - ends 11.7 from the sidebar, which is not far enough: the bottom
   of the disc would melt into it. The flat accent is 4.91 against its
   text and 20.9 from the sidebar.

   The size is a modifier, never a copy. The ring is a modifier too: it
   exists for the two that sit on a dark surface, where a disc needs an
   edge.
   See test_avatar.py. */
.alv-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--alv-accent);
    color: var(--alv-on-accent);
    font-weight: 600;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
}
.alv-avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}
.alv-avatar--md { width: 36px; height: 36px; font-size: 13px; }
.alv-avatar--lg { width: 38px; height: 38px; font-size: 15px; }
.alv-avatar--xl {
    width: 80px;
    height: 80px;
    font-size: 28px;
    letter-spacing: 1px;
}
/* On a dark surface only - the sidebar and the mobile nav. On paper the
   ring is white on white and draws nothing. */
.alv-avatar--ring { border: 2px solid rgba(255, 255, 255, 0.3); }
/* ===== /ALV AVATAR v1 ===== */


/* ALV REPORT HEAD v1 - the title row every business report shares.
   Titles on the left, Back or a headline figure on the right. The title
   is a label, so capitals, in ink; the subtitle - a date, a period, the
   record - in the soft ink, a size down. ALIVENTE ONLINE sits above the
   title on paper only: since 8 Sep no heading carries the brand, and a
   printed or emailed report is the one place it is the content rather
   than chrome. On a phone the row stacks and centres. See
   test_report_head.py. */
.alv-report-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
}
.alv-report-titles {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    flex: 1;
    min-width: 0;
}
.alv-report-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--alv-ink);
    text-transform: uppercase;
    margin: 0;
    overflow-wrap: anywhere;
}
.alv-report-sub {
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--alv-ink-soft);
    margin: 5px 0 0 0;
    overflow-wrap: anywhere;
}
.alv-report-brand { display: none; }
/* WHAT SITS BESIDE BACK - 30 Sep 2026. A report head holds titles and,
   on the right, Back. Payment Behaviour also carries a view switch -
   Include past tenants - which is navigation like Back rather than an
   action on the data, and it had been sitting in a toolbar below the
   summary strip, three scrolls from the thing it switches.

   A row, so the head keeps its two children and anything beside Back is
   laid out by one rule rather than by each page. Back inside this row is
   a flex item at its own width, which is what the phone rule below was
   arranging for when Back was a direct child.  [test_stats_fold.py] */
.alv-report-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    flex: 0 0 auto;
}
@media screen and (max-width: 768px) {
    .alv-report-head {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        margin-bottom: 16px;
    }
    .alv-report-titles { align-items: center; text-align: center; }
    .alv-report-title { font-size: 1.25rem; }
    .alv-report-sub { font-size: 1rem; }
    .alv-report-head > .btn {
        width: 100%;
        justify-content: center;
        text-align: center;
        padding: 10px 12px;
    }
    /* EXCEPT BACK - 30 Sep 2026. Demetri, testing on a phone, wrote
       "Back button" against four report screens in a row.

       The rule above stretches every button in the head to the full
       width and centres it, which is right for a headline figure and
       wrong for Back. Back is the one control in this system that is
       deliberately BORDERLESS - transparent background, transparent
       border, quiet on purpose. Measured at 390px it came out 362px
       wide, centred, and invisible: a line of centred text with an
       arrow in front of it, sitting under the date.

       So Back keeps its own width and goes to the right of the column -
       which is where it sits on a desktop, where it sits in every
       action bar, and where base's own phone rule for an action bar
       puts it. The 44px target is untouched.

       EIGHT REPORT PAGES, AND NOT ONE OF THEM IS EDITED. Every one
       already writes the markup 3.10 asks for.
                                             [test_report_back.py] */
    .alv-report-head > .btn.back-button,
    .alv-report-head > .btn.action-back {
        width: auto;
        align-self: flex-end;
    }
    /* The head is a column here, and .alv-report-actions is stretched
       across it like any other child - so the row it draws runs the full
       width of the phone with its first child left and Back right, which
       is what Demetri asked for. 30 Sep 2026. [test_stats_fold.py] */
    .alv-report-actions {
        justify-content: space-between;
        width: 100%;
    }
}
@media print {
    .alv-report-brand {
        display: block;
        margin: 0 0 4px 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--alv-accent-ink);
    }
}
/* /ALV REPORT HEAD v1 */

/* ALV APPLIES v1 - the date a Financials figure takes effect from, and
   the two ways to stop one. The panel sits under an entry form: a soft
   surface, the accent rule down its left edge, the label in ink with the
   calendar mark in the accent, the date as base's own field kept narrow,
   and the guidance under it in the soft ink. The choice cards are the two
   radios a delete pop-up offers - stop it from a date, the calm one, in
   the accent; remove it completely, which cannot be undone, in the bad
   colour. Their note and their date line indent to clear the radio. See
   test_applies_from.py. */
.alv-applies {
    background: var(--alv-surface);
    border: 1px solid var(--alv-line);
    border-left: 4px solid var(--alv-accent);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 18px;
}
.alv-applies > label {
    display: block;

/* The three classes base's own standards block is written in, which base
   did not declare until now. Every page that wanted one wrote it out: 33

   drift. The gap closes when a subtitle follows the heading and opens when
   nothing does - thirty pages worked that out one at a time, and five got
   it wrong. Said once, here, it cannot be got wrong again.

   The subtitle takes --alv-ink-soft. Six pages painted it #6c757d, which
   is Bootstrap's grey and belongs to no palette this project defines. A
   mode label under a module name should be the quieter of the two, which
   is what the shape-B round decided in words. */
.page-title-h2 {
    text-align: center;
    margin-top: 0.5rem;
    margin-bottom: 1rem;

.page-title-h2:has(+ .page-subtitle-h4) { margin-bottom: 0; }
/* AND THE SAME FOR THE OTHER SUBTITLE. G3a put twelve pages onto
   .page-title-h2 whose next line is an h5, and this selector did not know
   about the h5 - so the gap the rule exists to close stayed open on every
   one of them. Named separately rather than in a list, because :has()
   with a comma inside is read as "has any of these DESCENDANTS" by more
   than one minifier, and this is a sibling test. */
.page-title-h2:has(+ .page-subtitle-h5) { margin-bottom: 0; }

/* THE LINE UNDER THE BAR. A page that has to say what it is FOR
   has nowhere house to say it: .page-subtitle-h4 is a MODE label -
   ADD NEW PROPERTY - and 37 of its 38 wearers are two or three
   capitalised words. So five pages each invented a name for this
   one sentence and base declared none of them:

       .sub-note   household_member_management   12px  #6c757d
       .an-note    act_expense                   12px  #495057
       .pd-note    tenant_payment_days           .85rem #7f8c8d
       .ia-hint    fsr (in a chart modal)        12px  accent, bold

   sits BELOW the action bar, not above it: the title and the
   controls are what every screen has, and the explanation is what
   this screen adds. */

  font-size: 12px;
  color: var(--alv-ink-soft);
  margin: 14px auto 1rem;
  text-align: center;
  /* A SENTENCE, NOT A LABEL. Centred and unconstrained it ran 966px
     across at 12px on a 1280px screen - measured - which is about 150
     characters to a line and reads as a caption stretched to fit.
     Capped so it wraps as a paragraph; the cap is inert below it, so a
     phone is unaffected. */
  max-width: 68ch;
}


.page-subtitle-h4 {
    text-align: center;
    margin-top: 0.25rem;
    margin-bottom: 1rem;

/* THE DESCRIPTIVE LINE, DECLARED AT LAST - 30 Sep 2026.

/* ===== ALV POP v1 ===== 2 Oct 2026
   A list that opens from a cell - "12 ingredients", clicked, showing which
   twelve. Two pages carried this, byte for byte identical, under two
   names: .ingredient-popup on Categories and .usage-popup on Measurement
   Units.

   WHY IT IS FIXED AND NOT ABSOLUTE, which is the bug Demetri found. The
   popup lived inside .table-container, and that container is
   `overflow: clip` ON PURPOSE - it is what gives a sticky heading
   something to stick to, and base measured the difference (with `hidden`
   the heading floated 615px above the viewport; with `clip` it pins at
   top: 0). An absolutely-positioned child is POSITIONED by its nearest
   positioned ancestor but CLIPPED by any ancestor that clips, so the list
   was cut at the container's edge - worst for the rows nearest the top,
   which is exactly what the screenshots showed.

   Two correct decisions colliding, not a mistake in either. `fixed` is
   positioned against the viewport, so no ancestor's overflow can reach it.

   THE SCRIPT PLACES IT; THESE RULES ONLY PAINT IT. top/left are written
   on the element at open time, measured from the trigger, and the arrow
   flips with .alv-pop--below when there is no room above.

.alv-pop-trigger {

    display: inline-block;
    padding: 4px 8px;
    border-radius: var(--alv-radius-sm);

    position: fixed;

       the system's own dark, a shade deeper and less blue, and --alv-paper
       is the white it already pairs with everywhere else. */

    color: var(--alv-paper);

    border-radius: 10px;
    min-width: 180px;

    max-height: 250px;

    top: 100%;
    left: 50%;
    transform: translateX(-50%);

.alv-pop--below::after {

    border-top-color: transparent;
    border-bottom-color: var(--alv-ink);

   a page needs is:

     <div class="admin-tabs">
       <div class="admin-tab active" id="tab-x" onclick="...">..</div>
       <div class="admin-tab"        id="tab-y" onclick="...">..</div>
     </div>

.admin-tabs {

    max-width: 900px;

   so it belongs to every tab that HAS one - which is every tab but the
   last. Written out by name it cost two defects on the same page ten
   days apart: P6 on 29 Sep, when P2 removed the neighbour and left the
   tab open on its right, and PR-1 this morning, when a new tab
   inherited the declaration and had no neighbour of its own.

.admin-tab:not(:last-child) {
    border-right: none;

    display: block;

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }

        <div class="col-12 ti-number">
          <div class="form-group">

            <input type="text" class="form-control" id="tenant_contact_number" name="tenant_contact_number"

        <div class="col-12 ti-email">

    <style>
    /* TI-1, 26 Oct 2026 - the grid places the fields; nothing moves in
       the markup. Phone: one column, in markup order. */
    .ti-grid .ti-break { display: none; }
    .ti-grid.is-company .ti-id,
    .ti-grid.is-individual .ti-reg,
    .ti-grid.is-individual .ti-person { display: none; }
    .ti-grid.is-individual .ti-type   { order: 1; }
    .ti-grid.is-individual .ti-status { order: 2; }
    .ti-grid.is-individual .ti-break  { order: 3; }
    .ti-grid.is-individual .ti-name   { order: 4; }
    .ti-grid.is-individual .ti-id     { order: 5; }
    .ti-grid.is-individual .ti-number { order: 6; }
    .ti-grid.is-individual .ti-email  { order: 7; }
    @media screen and (min-width: 768px) {
      .ti-grid > .col-12 { flex: 0 0 25%; max-width: 25%; }
      .ti-grid.is-company .ti-type,
      .ti-grid.is-company .ti-name,
      .ti-grid.is-company .ti-status { flex-basis: 33.3333%; max-width: 33.3333%; }
      .ti-grid.is-individual .ti-break { display: block; flex: 0 0 100%; max-width: 100%; height: 0; }
    }
    </style>

    
    <div class="form-row" id="t2-add-row" style="display: none;">

    <div id="t2-section" style="display: none;">

                   value="" placeholder="Name of Second Tenant">

        <div class="col-md">
          <div class="form-group">
            <label for="tenant_2_id_number"><strong>Second Tenant Passport/ID</strong></label>
            <input type="text" class="form-control" id="tenant_2_id_number" name="tenant_2_id_number"
                   value="" placeholder="Passport or ID card number">

            <label for="tenant_2_contact_number"><strong>Second Tenant Contact Number</strong></label>

</div></form></div><script>
(function () {
  // A SECOND TENANT - T2-2, 24 Oct 2026.
  //
  // THE RULE LIVES IN pages/models.py clean(). This is the courtesy
  // that keeps a user from meeting it: same sentence, read off
  // Generate Lease Agreement, which has said it for months.
  var sel = document.getElementById('tenant_type');
  var addRow = document.getElementById('t2-add-row');
  var addBtn = document.getElementById('t2-add-btn');
  var sect = document.getElementById('t2-section');
  var remBtn = document.getElementById('t2-remove-btn');
  if (!sel || !addRow || !addBtn || !sect || !remBtn) return;

  // TI-1, 26 Oct 2026 - and the second tenant's Passport/ID, which
  // Remove Second Tenant clears with the rest.
  var FIELDS = ['tenant_2_name', 'tenant_2_id_number',
                'tenant_2_contact_number', 'tenant_2_email'];

  // THE NAME DECIDES, matching has_second_tenant on the model. A
  // telephone number with no name is a half-typed form, not a person.
  function named() {
    var el = document.getElementById('tenant_2_name');
    return !!(el && el.value.trim());
  }

  function clearAll() {
    for (var i = 0; i < FIELDS.length; i++) {
      var el = document.getElementById(FIELDS[i]);
      if (el) el.value = '';
    }
  }

  // '' AND NOT 'block', so the stylesheet keeps deciding. The house
  // gives #t2-add-row flex, being a .form-row; pinning a display here
  // would override a choice this script never made. MEASURED 24 Oct:
  // with one col-md-12 in it the row happens to LOOK the same either
  // way, which is why the rule is worth keeping rather than arguing
  // from. The physical-invoice reveal above does the same thing for
  // the same reason.
  // CONTACT PERSON IS A COMPANY FIELD - T2-6, 24 Oct 2026.
  //
  // IN THE LISTENER T2-2 ALREADY WROTE, not a second one beside it.
  // Two handlers on the same select is two answers to what the
  // screen should look like, and whichever ran last would win.
  var contactCol = document.getElementById('contact-person-field');
  var contactIn = document.getElementById('tenant_contact_person');

  function paintContact() {
    if (!contactCol) return;
    var company = (sel.value === 'Company');
    // '' AND NOT 'block' - the stylesheet keeps deciding, the same
    // rule T2-2 wrote four lines below. Generate says 'block' here;
    // that is the one thing of Generate's this does not copy.
    contactCol.style.display = company ? '' : 'none';
    // REQUIRED COMES OFF WITH IT. A hidden required field refuses
    // the form and the browser cannot show the user where.
    if (contactIn) contactIn.required = company;
    // TI-1, 26 Oct 2026 - THE GRID FOLLOWS THE TYPE: a Company keeps
    // Type | Name | Status over Reg Number | Contact Person | Number |
    // Email; an Individual is Type | Status over Name | Passport/ID |
    // Number | Email. The class places the fields; none of them moves.
    var grid = document.getElementById('ti-grid');
    if (grid) {
      grid.classList.toggle('is-company', company);
      grid.classList.toggle('is-individual', !company);
    }
    var nameIn = document.getElementById('tenant_name');
    if (nameIn) nameIn.placeholder = company ? 'Company name' : 'Full name';
  }

  function paint(open) {
    var individual = (sel.value === 'Individual');
    sect.style.display = (individual && open) ? '' : 'none';
    addRow.style.display = (individual && !open) ? '' : 'none';
    paintContact();
    paintSecondEmail();
  }

  // REQUIRED WHILE THERE IS A SECOND TENANT - T2-8, 25 Oct 2026.
  // THE NAME DECIDES, as named() and has_second_tenant do. A hidden,
  // emptied section must not leave `required` behind on its address:
  // the browser would refuse the form and could not show where.
  function paintSecondEmail() {
    if (!document.getElementById('tenant_2_email')) return;
    if (named()) {
      document.getElementById('tenant_2_email').required = true;
    } else {
      document.getElementById('tenant_2_email').required = false;
    }
  }

  addBtn.addEventListener('click', function () {
    paint(true);
    var el = document.getElementById('tenant_2_name');
    if (el) el.focus();
  });

  remBtn.addEventListener('click', function () {
    clearAll();
    paint(false);
  });

  sel.addEventListener('change', function () {
    if (sel.value !== 'Individual' && named()) {
      alert('You must remove the second tenant before changing to ' +
            'Company type. Second tenants are only allowed for ' +
            'Individual tenants.');
      sel.value = 'Individual';
      paint(true);
      return;
    }
    if (sel.value !== 'Individual') clearAll();
    paint(named());
  });

  // T2-8 - typing or clearing the second name moves the requirement.
  var t2NameIn = document.getElementById('tenant_2_name');
  if (t2NameIn) t2NameIn.addEventListener('input', paintSecondEmail);

  document.addEventListener('DOMContentLoaded', function () {
    paint(named());
  });
  paint(named());
})();
</script></body></html>
