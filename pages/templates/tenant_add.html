{% extends 'base.html' %}
{% load static %}

{% block title %}{% endblock %}

{% block content %}

<h2><center>ALIVENTE ONLINE - TENANTS</center></h2>
<h4><center>ADD NEW TENANT</center></h4>
<br/>

<!-- Display all messages -->
{% if messages %}
<div class="messages">
    {% for message in messages %}
    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}

<form id="tenantForm" action="{% url 'tenant_commit' %}" method="post">
  {% csrf_token %}
  
  <div style="display: flex; justify-content: flex-end">
      <button class="btn btn-info" style="margin-right:16px" type="submit">Save</button>
      <a href="{% url 'tenant' %}" class="btn btn-info" style="margin-right:16px" role="button">Back</a>
  </div>

  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="tenant_type"><strong>Tenant Type</strong></label>
      <select id="tenant_type" class="form-control" name="tenant_type" required>
        <option value="" disabled {% if not form_data.tenant_type %}selected{% endif %}>Select Tenant Type</option>
        <option value="Company" {% if form_data.tenant_type == 'Company' %}selected{% endif %}>Company</option>
        <option value="Individual" {% if form_data.tenant_type == 'Individual' %}selected{% endif %}>Individual</option>
      </select>
    </div>
    <div class="form-group col-md-4">
      <label for="tenant_name"><strong>Tenant</strong></label>
      <input type="text" class="form-control" id="tenant_name" name="tenant_name" 
             value="{{ form_data.tenant_name }}" placeholder="Company or Tenant Name" required>
    </div>
  </div>
  
  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="tenant_contact_person"><strong>Contact Person</strong></label>
      <input type="text" class="form-control" id="tenant_contact_person" name="tenant_contact_person" 
             value="{{ form_data.tenant_contact_person }}" placeholder="Name of Contact Person" required>
    </div>
    <div class="form-group col-md-4">
      <label for="tenant_contact_number"><strong>Contact Number</strong></label>
      <input type="text" class="form-control" id="tenant_contact_number" name="tenant_contact_number" 
             value="{{ form_data.tenant_contact_number }}" placeholder="Contact Number" required>
    </div>
    <div class="form-group col-md-4">
      <label for="tenant_email"><strong>Email Address</strong></label>
      <input type="email" class="form-control" id="tenant_email" name="tenant_email" 
             value="{{ form_data.tenant_email }}" placeholder="Tenant Email Address">
    </div>
  </div>
  
  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="tenant_lease_start_date"><strong>Lease Start Date</strong></label>
      <input type="date" class="form-control" id="tenant_lease_start_date" name="tenant_lease_start_date" 
             value="{{ form_data.tenant_lease_start_date }}" required>
    </div>
    <div class="form-group col-md-4">
      <label for="tenant_lease_end_date"><strong>Lease End Date</strong></label>
      <input type="date" class="form-control" id="tenant_lease_end_date" name="tenant_lease_end_date" 
             value="{{ form_data.tenant_lease_end_date }}" required>
    </div>
    <div class="form-group col-md-4">
      <label for="tenant_rental_type"><strong>Rental Type</strong></label>
      <select id="tenant_rental_type" class="form-control" name="tenant_rental_type" required>
        <option value="" disabled {% if not form_data.tenant_rental_type %}selected{% endif %}>Select Rental Type</option>
        <option value="Weekly" {% if form_data.tenant_rental_type == 'Weekly' %}selected{% endif %}>Weekly</option>
        <option value="Monthly" {% if form_data.tenant_rental_type == 'Monthly' %}selected{% endif %}>Monthly</option>
        <option value="Annual" {% if form_data.tenant_rental_type == 'Annual' %}selected{% endif %}>Annual</option>
      </select>
    </div>
  </div>
  
  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="tenant_deposit"><strong>Deposit</strong></label>
      <input type="number" class="form-control" id="tenant_deposit" name="tenant_deposit" 
             value="{{ form_data.tenant_deposit }}" placeholder="Deposit Amount" required>
    </div>
    <div class="form-group col-md-4">
      <label for="tenant_rent"><strong>Rental</strong></label>
      <input type="number" class="form-control" id="tenant_rent" name="tenant_rent" 
             value="{{ form_data.tenant_rent }}" placeholder="Rental Amount" required>
    </div>
    <div class="form-group col-md-4">
      <label for="tenant_levies"><strong>Levies</strong></label>
      <input type="number" class="form-control" id="tenant_levies" name="tenant_levies" 
             value="{{ form_data.tenant_levies }}" placeholder="Monthly Levy Amount" required>
    </div>
  </div>
  
  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="tenant_payment_terms"><strong>Rental Payment Terms (Days)</strong></label>
      <input type="number" class="form-control" id="tenant_payment_terms" name="tenant_payment_terms" 
             value="{{ form_data.tenant_payment_terms }}" placeholder="Payment Terms (Days)" required>
    </div>
    <div class="form-group col-md-4">
      <label for="tenant_renewal"><strong>Renewal Option</strong></label>
      <select id="tenant_renewal" class="form-control" name="tenant_renewal" required>
        <option value="" disabled {% if not form_data.tenant_renewal %}selected{% endif %}>Select if Lease is Renewable</option>
        <option value="Yes" {% if form_data.tenant_renewal == 'Yes' %}selected{% endif %}>Yes</option>
        <option value="No" {% if form_data.tenant_renewal == 'No' %}selected{% endif %}>No</option>
      </select>
    </div>    
    <div class="form-group col-md-4">
      <label for="tenant_renewal_period"><strong>Renewal Period (Days)</strong></label>
      <input type="number" class="form-control" id="tenant_renewal_period" name="tenant_renewal_period" 
             value="{{ form_data.tenant_renewal_period }}" placeholder="Renewal Period (Days)" required>
    </div>
  </div>
  
  
  <div class="form-row">
    <div class="form-group col-md-4">
      <label for="tenant_current"><strong>Tenant Status</strong></label>
      <select id="tenant_current" class="form-control" name="tenant_current" required>
        <option value="" disabled {% if not form_data.tenant_current %}selected{% endif %}>Select Active or Inactive</option>
        <option value="Yes" {% if form_data.tenant_current == 'Yes' %}selected{% endif %}>Active</option>
        <option value="No" {% if form_data.tenant_current == 'No' %}selected{% endif %}>Inactive</option>
      </select>
    </div>    
    <div class="form-group col-md-4">
      <label for="prop"><strong>Property</strong></label>
      <select id="prop" class="form-control" name="prop" required>
        <option value="" disabled {% if not form_data.prop %}selected{% endif %}>Select Property</option>
        {% for results in props %}
          {% if results.prop_available_for_rent == "Yes" %}
            <option value="{{ results.prop_id }}" 
                    {% if form_data.prop == results.prop_id|stringformat:"s" %}selected{% endif %}>
              {{ results.prop_name }}
            </option>
          {% endif %}
        {% endfor %}
      </select>
    </div>    
  </div>
</form>

<!-- Required JavaScript -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
$(document).ready(function() {
    // Auto-focus on first error field
    {% if messages %}
        $('html, body').animate({
            scrollTop: $('.alert').first().offset().top - 100
        }, 500);
    {% endif %}
});
</script>

<style>
.alert {
    padding: 10px 35px 10px 15px;
    margin-bottom: 20px;
    border-radius: 4px;
    position: relative;
}
.alert-error {
    color: #721c24;
    background-color: #f8d7da;
    border-color: #f5c6cb;
}
.alert-success {
    color: #155724;
    background-color: #d4edda;
    border-color: #c3e6cb;
}
.close {
    position: absolute;
    top: 5px;
    right: 10px;
    font-size: 1.5rem;
    cursor: pointer;
    background: transparent;
    border: none;
}
</style>

{% endblock %}
