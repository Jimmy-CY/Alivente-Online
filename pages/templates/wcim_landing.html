{% extends "base.html" %}
{% block content %}
<div class="container my-4">

  <!-- Header -->
  <h2 class="page-title-h2">WHAT CAN I MAKE?</h2>
  <div class="page-action-buttons">
    <a aria-label="Back to Recipe Management" href="{% url 'recipe_management' %}" class="btn action-back">
      <i class="fas fa-arrow-left"></i><span class="action-back-label"> Back</span></a>
  </div>
  <p class="page-note">Pick what you're in the mood for. You can select more than one.</p>

  <form method="post">
    {% csrf_token %}

    <!-- Anchor picker -->
    <div class="card mb-3">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0"><i class="fas fa-bullseye"></i> Pick your anchor(s)</h5>
      </div>
      <div class="card-body">
        <div class="anchor-grid">
          {% for anchor in anchors %}
            <label class="anchor-btn {% if anchor.slug in selected_anchors %}selected{% endif %}"
                   data-slug="{{ anchor.slug }}">
              <input type="checkbox" name="anchors" value="{{ anchor.slug }}"
                     {% if anchor.slug in selected_anchors %}checked{% endif %}>
              <i class="fas {{ anchor.icon }}"></i>
              <span>{{ anchor.label }}</span>
            </label>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="wcim-actions">
      <a href="{% url 'pantry_staples_management' %}" class="text-muted small wcim-staples-link">
        <i class="fas fa-cog"></i> Manage your pantry staples
      </a>
      <div class="wcim-actions-buttons">
        <button type="submit" name="action" value="skip" class="btn btn-outline-secondary">
          Skip extras &mdash; show me everything
        </button>
        <button type="submit" name="action" value="continue" class="btn action-primary">
          Continue <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

  </form>
</div>

<style>    /* B-2, 6 Oct 2026 - 1 literal(s) on this page became a var(), and
       unlike B-1 these MOVED: between 9 and 25 RGB units, which
       is below what an eye reads as a different colour and above
       nothing. Demetri looked at all four side by side at phone
       and desktop width before this ran.
       Two of them read BETTER: the muted grey goes 4.69:1 to
       5.53:1 on paper and the heading ink 10.98 to 12.95.
       The borders go the other way, 1.30 to 1.24, and that was
       the decision - they now agree with base.   [B-2 tier B] */
    /* B-1, 5 Oct 2026 - 1 literal(s) on this page became a var().
       Each one was already the byte-identical value of the
       token that replaced it, read from base's :root, so
       nothing here moved. What changes is that the page is on
       the token and will follow when the house does.
       Tier A of the Section B map; B and C move a pixel and
       are separate rounds.                   [B-1 tier A] */

  /* Anchor grid: equal-width cells that wrap responsively */
  .anchor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .anchor-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 12px;
    border: 2px solid #d4e4d4;
    border-radius: 8px;
    cursor: pointer;
    background: #fafafa;
    color: var(--alv-ink);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 0;
    transition: all 0.15s ease;
    user-select: none;
    text-align: center;
    min-height: 56px;
  }
  .anchor-btn:hover {
    border-color: #28a745;
    background: #f0fff4;
  }
  .anchor-btn.selected {
    background: #28a745;
    color: var(--alv-on-accent);
    border-color: #28a745;
    box-shadow: 0 2px 6px rgba(40, 167, 69, 0.3);
  }
  .anchor-btn input[type="checkbox"] {
    display: none;
  }
  .anchor-btn i {
    font-size: 18px;
  }

  /* Action row: side-by-side on desktop, stacked on mobile */
  .wcim-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .wcim-actions-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  @media screen and (max-width: 575.98px) {
    .wcim-actions {
      flex-direction: column;
      align-items: stretch;
    }
    .wcim-actions-buttons {
      flex-direction: column;
      width: 100%;
    }
    .wcim-actions-buttons .btn {
      width: 100%;
    }
    .wcim-staples-link {
      text-align: center;
      padding: 4px 0;
    }
  }
</style>
{% endblock %}

{% block extra_scripts %}
<script>
  $(document).ready(function () {
    $('.anchor-btn').on('click', function (e) {
      // Stop the native label-click toggling the hidden checkbox twice
      e.preventDefault();
      var $btn = $(this);
      var $cb = $btn.find('input[type="checkbox"]');
      var nowChecked = !$cb.prop('checked');
      $cb.prop('checked', nowChecked);
      $btn.toggleClass('selected', nowChecked);
    });
  });
</script>
{% endblock %}
