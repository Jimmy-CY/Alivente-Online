{% extends "base.html" %}
{% block content %}
<div class="container my-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h2 class="mb-1" style="color: #2c3e50;">
        <i class="fas fa-utensils text-success"></i> What Can I Make?
      </h2>
      <p class="text-muted mb-0">
        Pick what you're in the mood for. You can select more than one.
      </p>
    </div>
    <a href="{% url 'recipe_management' %}" class="btn btn-secondary">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>

  <form method="post">
    {% csrf_token %}

    <!-- Anchor picker -->
    <div class="card mb-3">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0"><i class="fas fa-bullseye"></i> Pick your anchor(s)</h5>
      </div>
      <div class="card-body">
        <div class="anchor-grid">
          {% for anchor in anchors %}
            <label class="anchor-btn {% if anchor.slug in selected_anchors %}selected{% endif %}"
                   data-slug="{{ anchor.slug }}">
              <input type="checkbox" name="anchors" value="{{ anchor.slug }}"
                     {% if anchor.slug in selected_anchors %}checked{% endif %}>
              <i class="fas {{ anchor.icon }}"></i>
              <span>{{ anchor.label }}</span>
            </label>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="wcim-actions">
      <a href="{% url 'pantry_staples_management' %}" class="text-muted small wcim-staples-link">
        <i class="fas fa-cog"></i> Manage your pantry staples
      </a>
      <div class="wcim-actions-buttons">
        <button type="submit" name="action" value="skip" class="btn btn-outline-secondary">
          Skip extras &mdash; show me everything
        </button>
        <button type="submit" name="action" value="continue" class="btn btn-success">
          Continue <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

  </form>
</div>

<style>
  /* Anchor grid: equal-width cells that wrap responsively */
  .anchor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .anchor-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 12px;
    border: 2px solid #d4e4d4;
    border-radius: 8px;
    cursor: pointer;
    background: #fafafa;
    color: #2c3e50;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 0;
    transition: all 0.15s ease;
    user-select: none;
    text-align: center;
    min-height: 56px;
  }
  .anchor-btn:hover {
    border-color: #28a745;
    background: #f0fff4;
  }
  .anchor-btn.selected {
    background: #28a745;
    color: white;
    border-color: #28a745;
    box-shadow: 0 2px 6px rgba(40, 167, 69, 0.3);
  }
  .anchor-btn input[type="checkbox"] {
    display: none;
  }
  .anchor-btn i {
    font-size: 18px;
  }

  /* Action row: side-by-side on desktop, stacked on mobile */
  .wcim-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .wcim-actions-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  @media (max-width: 575.98px) {
    .wcim-actions {
      flex-direction: column;
      align-items: stretch;
    }
    .wcim-actions-buttons {
      flex-direction: column;
      width: 100%;
    }
    .wcim-actions-buttons .btn {
      width: 100%;
    }
    .wcim-staples-link {
      text-align: center;
      padding: 4px 0;
    }
  }
</style>
{% endblock %}

{% block extra_scripts %}
<script>
  $(document).ready(function () {
    $('.anchor-btn').on('click', function (e) {
      // Stop the native label-click toggling the hidden checkbox twice
      e.preventDefault();
      var $btn = $(this);
      var $cb = $btn.find('input[type="checkbox"]');
      var nowChecked = !$cb.prop('checked');
      $cb.prop('checked', nowChecked);
      $btn.toggleClass('selected', nowChecked);
    });
  });
</script>
{% endblock %}
