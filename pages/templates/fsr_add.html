{% extends 'base.html' %}
{% load static %}
{% block title %}Add Issue | Alivente Online{% endblock %}
{% block content %}

<h2 class="page-title-center">ALIVENTE ONLINE - ISSUES</h2>
<h4 class="page-subtitle-center">ADD ISSUE</h4>
<br/>

<form action="{% url 'fsr_commit' %}" method="post">
  {% csrf_token %}

  <!-- Action Buttons -->
  <div class="page-action-bar">
    <div class="page-action-bar-inner">
      <button class="btn btn-info action-primary" type="submit">Save</button>
      <button class="btn btn-info action-back" onclick="history.back()" type="button" aria-label="Back">
        <i class="fas fa-arrow-left"></i><span class="action-back-label"> Back</span>
      </button>
    </div>
  </div>
  <br/>

  <div class="form-row">
    <div class="form-group col-md-3">
      <label for="prop"><strong>Property Name</strong></label>
      <select id="prop" class="form-control" name="prop" required>
        <option value="" disabled selected>Select Property</option>
        {% for results in props %}
          <option value="{{results.prop_id}}">{{results.prop_name}}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group col-md-2">
      <label for="issues_date_logged"><strong>Date Logged</strong></label>
      <input placeholder="Date Logged" type="date" id="issues_date_logged" class="form-control" name="issues_date_logged" value="{{log_date|date:'Y-m-d'}}" readonly>
    </div>
    <div class="form-group col-md-2">
      <label for="issues_status"><strong>Issue Status</strong></label>
      <input placeholder="Issue Status" type="text" id="issues_status" class="form-control" name="issues_status" value="Unresolved" readonly>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group col-md-3">
      <label for="issues_heading"><strong>Issue Heading</strong></label>
      <input placeholder="Issue Heading" type="text" id="issues_heading" class="form-control" name="issues_heading" maxlength="35" required>
    </div>
    <div class="form-group col-md-4">
      <label for="issues_description"><strong>Issue Description</strong></label>
      <input placeholder="Issue Description" type="text" id="issues_description" class="form-control" name="issues_description" maxlength="50" required>
    </div>
    <div class="form-group col-md-1">
      <input type="hidden" id="issues_resolution_date" name="issues_resolution_date" value="1900-01-01">
    </div>
  </div>
</form>

<style>
.page-title-center { text-align: center; }
.page-subtitle-center { text-align: center; }

.page-action-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
}
.page-action-bar-inner {
    display: flex;
    gap: 16px;
}

@media (max-width: 768px) {
    .page-title-center { font-size: 1.2rem; padding: 0 8px; }
    .page-subtitle-center { font-size: 1rem; padding: 0 8px; }

    .page-action-bar { margin-bottom: 14px; }
    .page-action-bar-inner {
        flex-direction: row;
        gap: 8px;
        width: 100%;
        align-items: stretch;
        flex-wrap: nowrap;
    }

    .page-action-bar-inner .action-primary {
        flex: 1 1 auto;
        min-width: 0;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 12px;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0;
    }

    .page-action-bar-inner .action-back {
        flex: 0 0 auto;
        width: 44px;
        height: 38px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
    }

    .action-back-label {
        display: none;
    }

    /* iOS zoom guard */
    .form-control,
    select.form-control,
    input[type="text"].form-control,
    input[type="date"].form-control {
        font-size: 16px !important;
    }

    /* Tighter form spacing on mobile */
    .form-group {
        margin-bottom: 12px;
    }
}
</style>

{% endblock %}
