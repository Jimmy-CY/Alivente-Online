{% extends 'base.html' %}
{% load static %}

{% block title %}
{% endblock %}

{% block content %}

<h2><center>ALIVENTE ONLINE - EXPENSE LINE TYPES</center></h2>
<h4><center>ADD LINE TYPE</center></h4>
<br/>

{% if user.is_superuser %}

<form action = "{% url 'finance_expense_line_types_commit' %}" method="post">
  
  {% csrf_token %}
  <div style="display: flex ; justify-content: flex-end">
      <button class="btn btn-info" style="margin-right:16px" type="submit">Save</button>
      <a href="{% url 'finance_expense_line_types' %}" class="btn btn-info" style="margin-right:16px" role="button">Back</a>
  </div>
<br/>
  <div class="form-row">
    <div class="form-group col-md-3">
      <label for="expense_line_types_name"><strong>Expense Line Type Name</strong></label>
      <input type="text" class="form-control" id="expense_line_types_name" name="expense_line_types_name" placeholder="Name" maxlength="30" required>
    </div>
    <div class="form-group col-md-3">
      <label for="expense_line_types_description"><strong>Expense Line Type Description</strong></label>
      <input type="text" class="form-control" id="expense_line_types_description" name="expense_line_types_description" placeholder="Description" maxlength="30" required>
    </div>
    <div class="form-group col-md-3">
      <label for="expense_line_types_prorata"><strong>Pro-Rata (Yes/No)</strong></label>
      <select class="form-control" id="expense_line_types_prorata" name="expense_line_types_prorata" required>
        <option value="" disabled selected>Select an option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <div class="form-group col-md-3">
      <label for="expense_line_types_pr_amount"><strong>Pro-Rata Amount</strong></label>
      <input type="number" class="form-control" id="expense_line_types_pr_amount" 
             name="expense_line_types_pr_amount" placeholder="0.00" 
             step="0.01" min="0" maxlength="30" required>
    </div>
  </div>

</form>

{% endif %}

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
  const $prorataField = $('#expense_line_types_prorata');
  const $amountField = $('#expense_line_types_pr_amount');

  // Initialize on page load
  updateAmountField();

  // Update when dropdown changes
  $prorataField.on('change', updateAmountField);

  function updateAmountField() {
    if ($prorataField.val() === 'Yes') {
      $amountField.prop('disabled', false).val(''); // Enable & clear
    } else {
      $amountField.prop('disabled', true).val('0'); // Disable & set to 0
    }
  }
});
</script>

{% endblock %}
