{% extends 'base.html' %}
{% load static %}

{% block title %}Properties Map View{% endblock %}

{% block content %}
<div class="map-page-container">
    <div class="map-page-header">
        <div class="map-page-title-wrap">
            <h2 class="map-page-title">Properties Map View</h2>
            <p id="propertyCount" class="map-page-subtitle text-muted">Loading properties...</p>
        </div>
        <div class="map-page-controls">
            <button id="centerMapBtn" class="btn action-primary">
                <i class="fas fa-crosshairs"></i> Center Map
            </button>
            <a href="{% url 'properties' %}" class="btn action-back" role="button" aria-label="Back">
                <i class="fas fa-arrow-left"></i><span class="action-back-label"> Back</span>
            </a>
        </div>
    </div>

    <div id="map" class="property-map"></div>

    <!-- Property Info Modal -->
    <div id="propertyModal" class="modal fade" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-fullscreen-mobile" role="document">
            <div class="modal-content">
                <div class="modal-header alv-modal-head">
                    <h5 class="modal-title">Property Details</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="modalContent">
                    <!-- Property details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn action-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* B-7, 9 Oct 2026 - 2 Bootstrap literal(s) on this page
       became a var(). The ones in script blocks and in style
       attributes are converted because the browser reads them
       as CSS in the end; a colour handed to a chart library as
       DATA is not converted and never will be by a round of
       this shape - see apply_brights.py. */    /* B-3, 6 Oct 2026 - 2 literal(s) on this page became a var(), and this
       round is TIER C: these are real colour changes, not
       nudges. Bootstrap green and red become the house good and
       bad. Demetri looked at both widths before it ran.
       EVERY ONE OF THEM READS BETTER. The green was the worst
       colour left in the tree - 3.13:1 as text on paper, under
       the 4.5 AA wants - and goes to 5.12. The red goes 4.53 to
       6.54. Nothing in this round loses contrast.
       THE HOVERS MOVED WITH THEM, to the -ink tokens, because a
       hover that stayed Bootstrap would have gone LIGHTER than
       its own rest state.                      [B-3 tier C] */
    /* B-2b, 6 Oct 2026 - 1 literal(s) on this page became a var().
       The tail of tier B: everything within 25 RGB units of a
       token that was not one of B-2 four neutrals. Twenty-one
       spellings of a pale teal, fifty-three greys, and the
       Bootstrap alert colours. Same bounded gate as B-2: each
       one moves by exactly the distance the map records, or
       the round refuses to run.               [B-2b tier B] */
    /* B-2, 6 Oct 2026 - 2 literal(s) on this page became a var(), and
       unlike B-1 these MOVED: between 9 and 25 RGB units, which
       is below what an eye reads as a different colour and above
       nothing. Demetri looked at all four side by side at phone
       and desktop width before this ran.
       Two of them read BETTER: the muted grey goes 4.69:1 to
       5.53:1 on paper and the heading ink 10.98 to 12.95.
       The borders go the other way, 1.30 to 1.24, and that was
       the decision - they now agree with base.   [B-2 tier B] */

/* ==================== DESKTOP STYLES ==================== */

.map-page-container {
    width: 100%;
    height: 100vh;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

.map-page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 16px;
    flex-shrink: 0;
}

.map-page-title-wrap {
    flex: 1;
    min-width: 0;
}

.map-page-title {
    margin: 0;
    color: var(--alv-ink);
}

.map-page-subtitle {
    margin: 4px 0 0 0;
    font-size: 14px;
}

.map-page-controls {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
}

.property-map {
    flex: 1;
    width: 100%;
    border: 2px solid var(--alv-line);
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    min-height: 400px;
}

/* Custom marker popup styles */
.property-popup {
    font-family: Arial, sans-serif;
}

.property-popup h4 {
    margin: 0 0 10px 0;
    color: var(--alv-ink);
    font-size: 16px;
}

.property-popup p {
    margin: 5px 0;
    font-size: 14px;
}

.property-popup .status-active {
    color: var(--alv-good);
    font-weight: bold;
}

.property-popup .status-inactive {
    color: var(--alv-bad);
    font-weight: bold;
}

.property-popup .view-details {
    color: var(--alv-accent);
    text-decoration: none;
    font-weight: 500;
}

.property-popup .view-details:hover {
    text-decoration: underline;
}

/* ==================== MOBILE STYLES (≤768px) ==================== */
@media screen and (max-width: 768px) {

    .map-page-container {
        padding: 10px;
        height: calc(100vh - 56px); /* leave room for the top nav */
        min-height: 500px;
    }

    /* Header — stack title and controls vertically */
    .map-page-header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-bottom: 10px;
    }

    .map-page-title {
        font-size: 1.3rem;
    }

    .map-page-subtitle {
        font-size: 12px;
    }

    /* Controls — Center Map (wide) + Back (icon only), follows new standard */
    .map-page-controls {
        display: flex;
        flex-direction: row;
        gap: 8px;
        width: 100%;
        flex-wrap: nowrap;
        align-items: stretch;
    }
    .map-page-controls .action-primary {
        flex: 1 1 auto;
        min-width: 0;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 12px;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0;
    }
    .map-page-controls .action-back {
        flex: 0 0 auto;
        width: 44px;
        height: 38px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
    }

    /* Map — fills remaining height */
    .property-map {
        min-height: 60vh;
    }

    /* Modal — full-screen on mobile */
    .modal-fullscreen-mobile {
        max-width: 100%;
        margin: 0;
        padding: 0;
    }
    .modal-fullscreen-mobile .modal-content {
        border-radius: 0;
        min-height: 100vh;
    }

    /* Popup typography — slightly smaller for mobile */
    .property-popup h4 {
        font-size: 15px;
    }
    .property-popup p {
        font-size: 13px;
    }
}
</style>

<!-- Include Leaflet CSS and JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Map script starting...');

    // Update status
    document.getElementById('propertyCount').textContent = 'Initializing map...';

    // Initialize the map
    var map = L.map('map').setView([35.1264, 33.4299], 6);

    // MAP TILES. The URL, the words under them and the zoom ceiling are
    // defined ONCE, in mysite/context_processors.py, and arrive here through
    // the context. They used to be spelled out on each of the four pages that
    // draw a map, and map_view's old comment records what that cost.
    //
    // AN EMPTY URL MEANS NO KEY IS CONFIGURED, and the page says so. It does
    // not add a tile layer and hope: a map with no basemap is an empty grey
    // square, which reads as a fault in the page rather than as a setting
    // nobody has filled in. See apply_map_provider.py.
    var mapTileUrl = '{{ MAP_TILE_URL|escapejs }}';
    if (mapTileUrl) {
        L.tileLayer(mapTileUrl, {
            attribution: '{{ MAP_ATTRIBUTION|escapejs }}',
            maxZoom: {{ MAP_MAX_ZOOM }}
        }).addTo(map);
    } else {
        document.getElementById('map').insertAdjacentHTML('afterbegin',
            '<div class="alv-map-nokey">Map unavailable &mdash; no map key is ' +
            'configured. Set GEOAPIFY_KEY and redeploy.</div>');
    }

    // Store all markers for centering
    var markers = [];

    // Get properties data - simple approach
    var rawPropertiesData = '{{ properties_json|escapejs }}';
    var properties = [];

    try {
        properties = JSON.parse(rawPropertiesData);
        console.log('Properties loaded:', properties.length);
        console.log('First property:', properties[0]);

        // Debug each property's coordinates
        properties.forEach(function(prop, index) {
            console.log('Property ' + index + ':', prop.name,
                       'Lat:', prop.latitude, '(type: ' + typeof prop.latitude + ')',
                       'Lng:', prop.longitude, '(type: ' + typeof prop.longitude + ')');
        });

    } catch (error) {
        console.error('Error parsing properties:', error);
        document.getElementById('propertyCount').textContent = 'Error loading properties: ' + error.message;
        return;
    }

    // Filter properties with coordinates
    var propertiesWithCoords = properties.filter(function(property) {
        var hasLat = property.latitude && property.latitude !== '' && property.latitude !== 'None' && property.latitude !== null;
        var hasLng = property.longitude && property.longitude !== '' && property.longitude !== 'None' && property.longitude !== null;

        console.log('Filtering property:', property.name,
                   'hasLat:', hasLat, '(' + property.latitude + ')',
                   'hasLng:', hasLng, '(' + property.longitude + ')');

        return hasLat && hasLng;
    });

    console.log('Properties with coordinates:', propertiesWithCoords.length);

    // Add properties to map
    propertiesWithCoords.forEach(function(property, index) {
        var lat = parseFloat(property.latitude);
        var lon = parseFloat(property.longitude);

        if (isNaN(lat) || isNaN(lon)) {
            console.warn('Invalid coordinates for property:', property.name, lat, lon);
            return;
        }

        console.log('Adding marker for:', property.name, 'at', lat, lon);

        // Create location pin marker
        var icon = L.divIcon({
            className: 'custom-marker',
            html: '<div style="color: var(--alv-bad); font-size: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">📍</div>',
            iconSize: [20, 20],
            iconAnchor: [10, 20]
        });

        // Create marker
        var marker = L.marker([lat, lon], { icon: icon }).addTo(map);
        markers.push(marker);

        // Build complete address for display
        var addressParts = [
            property.address1,
            property.address2,
            property.suburb,
            property.city,
            property.province,
            property.country,
            property.pcode
        ];
        var displayAddress = addressParts.filter(function(part) {
            return part && part.trim() !== '';
        }).join(', ');

        // Create popup content
        var popupContent = '<div class="property-popup">' +
            '<h4>' + (property.name || 'Property #' + property.id) + '</h4>' +
            '<p><strong>Address:</strong> ' + (displayAddress || 'Address not available') + '</p>' +
            '<p><strong>Status:</strong> <span class="status-' + (property.status ? property.status.toLowerCase() : 'unknown') + '">' + (property.status || 'Unknown') + '</span></p>' +
            '<p><strong>Available for Rent:</strong> ' + (property.available_for_rent || 'Unknown') + '</p>';

        if (property.floor_area) {
            popupContent += '<p><strong>Floor Area:</strong> ' + property.floor_area + ' m²</p>';
        }
        if (property.year_built) {
            popupContent += '<p><strong>Year Built:</strong> ' + property.year_built + '</p>';
        }

        popupContent += '<p><strong>Coordinates:</strong> ' + lat.toFixed(6) + ', ' + lon.toFixed(6) + '</p>' +
            '</div>';

        marker.bindPopup(popupContent);
    });

    // Update property count with user-friendly text
    if (propertiesWithCoords.length === properties.length) {
        // All properties are shown
        document.getElementById('propertyCount').textContent = 'Showing All Properties on Map';
    } else {
        // Some properties are missing coordinates - just show the warning
        var missingCount = properties.length - propertiesWithCoords.length;
        var propertyWord = missingCount === 1 ? 'property' : 'properties';
        var verbWord = missingCount === 1 ? 'is' : 'are';

        document.getElementById('propertyCount').innerHTML =
            '<small class="text-warning">' + missingCount + ' ' + propertyWord + ' without coordinates ' + verbWord + ' hidden</small>';
    }

    // Function to center map on all markers
    function centerMapOnMarkers() {
        if (markers.length > 0) {
            var group = new L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.1));
        }
    }

    // Center map on load
    if (markers.length > 0) {
        centerMapOnMarkers();
    }

    // Center map button functionality
    document.getElementById('centerMapBtn').addEventListener('click', function() {
        centerMapOnMarkers();
    });

    // Mobile fix: Leaflet maps need to recalculate size when their container changes
    setTimeout(function() {
        map.invalidateSize();
    }, 250);

    console.log('Map initialization complete. Markers:', markers.length);
});
</script>
{% endblock %}
