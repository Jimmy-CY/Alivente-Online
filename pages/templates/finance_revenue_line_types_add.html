{% extends 'base.html' %}
{% load static %}

{% block title %}Add Revenue Line Type{% endblock %}

{% block content %}

{% if perms.auth.can_access_financials %}

<style>
        /* THE COLOURED BANNER WENT - 8 Sep.

           This page headed itself with a filled green gradient band and a
           white white title. Twenty templates across Financials did, in two
           colours - green for revenue, red for expenses - and the same
           component exists in five hues system-wide.

           It is now the heading 65 of the 125 templates already use, and
           that finance/cashflow_forecast.html in this very folder already
           used: a centred <h2>, an optional centred <h5> beneath it, and no
           icon. Not one of those 65 carries an icon, which is why this
           one's went with the band.

           The colour coding went deliberately. Green and red already mean
           --alv-good and --alv-bad - on time and overdue - everywhere else
           in this system, and a heading cannot be green for one reason
           while a figure beside it is green for another. */

.rlt-form-container {
    max-width: 900px;
    margin: 0 auto;
}

.form-card {
    background: white;
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 22px;
}

.form-field label {
    display: block;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 6px;
    font-size: 14px;
}
.form-field .form-control {
    width: 100%;
    padding: 9px 12px;
    border: 2px solid #dee2e6;
    border-radius: 7px;
    font-size: 14px;
    background: white;
    transition: border-color 0.15s ease;
}
.form-field .form-control:focus {
    border-color: #28a745;
    outline: none;
    box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.1);
}
@media (max-width: 768px) {
    .rlt-form-container {
        padding: 0 8px;
    }

    .action-back-label {
        display: none;
    }

    .form-card {
        padding: 16px;
        border-radius: 10px;
    }
    .form-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .form-field .form-control,
    .form-field input[type="text"] {
        font-size: 16px !important;
    }
}
</style>

<form action="{% url 'finance_revenue_line_types_commit' %}" method="post">
    {% csrf_token %}
    
    <div class="rlt-form-container">
        
        <!-- Page Header -->
        <h2><center>Add Revenue Line Type</center></h2>
            
            <h5><center>Define a new line type for grouping revenue</center></h5>
        
        <br/>
        
        <!-- Action Bar -->
        <div class="page-action-buttons">
            <button type="submit" class="btn action-primary">
                <i class="fas fa-save"></i> Save
            </button>
            <a href="{% url 'finance_revenue_line_types' %}" class="btn action-back" aria-label="Back">
                <i class="fas fa-arrow-left"></i><span class="action-back-label"> Back</span>
            </a>
        </div>
        
        <!-- Form Card -->
        <div class="form-card">
            <div class="form-grid">
                
                <div class="form-field">
                    <label for="revenue_line_types_name">Revenue Line Type Name<span class="alv-req">*</span></label>
                    <input type="text" 
                           class="form-control" 
                           id="revenue_line_types_name" 
                           name="revenue_line_types_name" 
                           placeholder="e.g., Recurring, Ad-hoc" 
                           maxlength="30" 
                           required>
                </div>
                
                <div class="form-field">
                    <label for="revenue_line_types_description">Description<span class="alv-req">*</span></label>
                    <input type="text" 
                           class="form-control" 
                           id="revenue_line_types_description" 
                           name="revenue_line_types_description" 
                           placeholder="Short description" 
                           maxlength="30" 
                           required>
                </div>
                
            </div>
        </div>
        
    </div>
</form>

{% endif %}

{% endblock %}
