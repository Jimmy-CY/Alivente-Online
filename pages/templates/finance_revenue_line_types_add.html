{% extends 'base.html' %}
{% load static %}

{% block title %}
{% endblock %}

{% block content %}

<h2><center>ALIVENTE ONLINE - REVENUE LINE TYPES</center></h2>
<h4><center>ADD LINE TYPE</center></h4>
<br/>

{% if perms.auth.can_access_financials %}

<form action = "{% url 'finance_revenue_line_types_commit' %}" method="post">
  
  {% csrf_token %}
  <div style="display: flex ; justify-content: flex-end">
      <button class="btn btn-info" style="margin-right:16px" type="submit">Save</button>
      <a href="{% url 'finance_revenue_line_types' %}" class="btn btn-info" style="margin-right:16px" role="button">Back</a>
  </div>
<br/>
  <div class="form-row">
    <div class="form-group col-md-3">
      <label for="revenue_line_types_name"><strong>Revenue Line Type Name</strong></label>
      <input type="text" class="form-control" id="revenue_line_types_name" name="revenue_line_types_name" placeholder="Name" maxlength="30" required>
    </div>
    <div class="form-group col-md-3">
      <label for="revenue_line_types_description"><strong>Revenue Line Type Description</strong></label>
      <input type="text" class="form-control" id="revenue_line_types_description" name="revenue_line_types_description" placeholder="Description" maxlength="30" required>
    </div>
  </div>

</form>

{% endif %}

{% endblock %}
