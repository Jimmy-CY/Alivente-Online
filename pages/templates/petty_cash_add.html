{% extends 'base.html' %}
{% load static %}
{% block title %}Add Petty Cash Transaction{% endblock %}
{% block content %}

<h2 class="page-title-h2">PETTY CASH</h2>
<h4 class="page-subtitle-h4">ADD TRANSACTION</h4>
<br/>

<form action="{% url 'petty_cash_commit' %}" method="post" id="pettyCashForm">
  {% csrf_token %}

  <!-- Action Buttons (Save + Back) -->
  <div class="page-action-buttons">
    <button class="btn action-primary" type="submit">
      <i class="fas fa-save"></i> Save
    </button>
    <a href="{% url 'petty_cash' %}" class="btn action-back" role="button" aria-label="Back">
      <i class="fas fa-arrow-left"></i><span class="action-back-label"> Back</span>
    </a>
  </div>

  <!-- Transaction Details Section -->
  <div class="form-card">
    <h3 class="form-section-title"><i class="fas fa-receipt"></i> Transaction Details</h3>
    <div class="form-row">
      <div class="form-group col-md-3">
        <label for="petty_cash_date"><strong>Date <span class="alv-req">*</span></strong></label>
        <input placeholder="Transaction Date" type="date" id="petty_cash_date" class="form-control" name="petty_cash_date" required>
      </div>
      <div class="form-group col-md-5">
        <label for="petty_cash_description"><strong>Description <span class="alv-req">*</span></strong></label>
        <input type="text" class="form-control" id="petty_cash_description" name="petty_cash_description" placeholder="Transaction Description" maxlength="55" required>
      </div>
      <div class="form-group col-md-2">
        <label for="petty_cash_amount"><strong>Amount <span class="alv-req">*</span></strong></label>
        <input type="number" inputmode="decimal" class="form-control" id="petty_cash_amount" name="petty_cash_amount" placeholder="0.00" step="0.01" min="0" required>
      </div>
      <div class="form-group col-md-2">
        <label for="petty_cash_dr_cr"><strong>Type <span class="alv-req">*</span></strong></label>
        <select id="petty_cash_dr_cr" class="form-control" name="petty_cash_dr_cr" required>
          <option value="" disabled selected>Income / Expense</option>
          <option value="DR">Income</option>
          <option value="CR">Expense</option>
        </select>
      </div>
    </div>
  </div>

</form>

<style>

/* Form group / form row tweaks */
.form-row {
    margin-left: -8px;
    margin-right: -8px;
}
.form-row > [class*="col-"] {
    padding-left: 8px;
    padding-right: 8px;
}

/* ==================== MOBILE STYLES (≤768px) ==================== */
@media screen and (max-width: 768px) {

    .action-back-label {
        display: none;
    }

    /* Form section — tighter padding */
    .form-card {
        padding: 14px 14px;
        margin-bottom: 14px;
        border-radius: 6px;
    }

    /* Form rows → single column */
    .form-row {
        margin-left: 0;
        margin-right: 0;
    }
    .form-row > [class*="col-"] {
        padding-left: 0;
        padding-right: 0;
        flex: 0 0 100%;
        max-width: 100%;
    }
    .form-group {
        margin-bottom: 12px;
    }
    .form-group:last-child {
        margin-bottom: 0;
    }
    .form-group label {
        font-size: 13px;
    }

    /* Inputs — 16px font to prevent iOS zoom-on-focus */
    .form-group .form-control {
        padding: 10px 12px;
    }
}
</style>

{% endblock %}
