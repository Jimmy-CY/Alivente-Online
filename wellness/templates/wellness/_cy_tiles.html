{% comment %} CY-5, 17 Nov 2026 - one row of icon tiles for Log a day. name and kind come from the include; the drawings are constants from cycle_icons.py. {% endcomment %}{% for t in tiles %}<label class="cy-tile"><input type="{{ kind|default:'checkbox' }}" name="{{ name }}" value="{{ t.value }}"{% if t.on %} checked{% endif %}{% if kind == 'radio' and name != 'flow' %} data-untick{% endif %}><span class="cy-ic"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">{{ t.svg|safe }}</svg></span><span class="cy-lb">{{ t.label }}</span></label>{% endfor %}
